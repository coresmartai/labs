<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="640" fill="url(#bg)"/>
  <text x="550" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">Benchmark Harness - Inputs to Insights</text>
  <text x="550" y="72" text-anchor="middle" font-size="14" fill="#64748B">For each example in the golden set, call all three providers, time them, score them, write to a comparison table.</text>

  <g filter="url(#sh)">
    <rect x="50" y="270" width="180" height="100" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="140" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="#451A03">Golden example</text>
    <text x="140" y="325" text-anchor="middle" font-size="11" font-family="monospace" fill="#475569">input + expected</text>
    <text x="140" y="345" text-anchor="middle" font-size="10" fill="#94A3B8">loop over the file</text>
  </g>
  <g filter="url(#sh)">
    <rect x="280" y="160" width="200" height="80" rx="14" fill="#DCFCE7" stroke="#10B981" stroke-width="2"/>
    <text x="380" y="193" text-anchor="middle" font-size="14" font-weight="700" fill="#064E3B">gpt-5.4-mini call</text>
    <text x="380" y="216" text-anchor="middle" font-size="11" fill="#475569">time it · capture result</text>
  </g>
  <g filter="url(#sh)">
    <rect x="280" y="280" width="200" height="80" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
    <text x="380" y="313" text-anchor="middle" font-size="14" font-weight="700" fill="#4C1D95">gpt-5.4-nano call</text>
    <text x="380" y="336" text-anchor="middle" font-size="11" fill="#475569">time it · capture result</text>
  </g>
  <g filter="url(#sh)">
    <rect x="280" y="400" width="200" height="80" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="380" y="433" text-anchor="middle" font-size="14" font-weight="700" fill="#451A03">qwen3:0.6b call</text>
    <text x="380" y="456" text-anchor="middle" font-size="11" fill="#475569">time it · capture result</text>
  </g>

  <!-- Fan-out from Golden example (right edge x=230, vertical mid y=320) to the three call boxes -->
  <line x1="230" y1="320" x2="280" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="320" x2="280" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="320" x2="280" y2="440" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#sh)">
    <rect x="510" y="160" width="180" height="80" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
    <text x="600" y="180" text-anchor="middle" font-size="11" font-family="monospace" fill="#0F172A">label, confidence,</text>
    <text x="600" y="197" text-anchor="middle" font-size="11" font-family="monospace" fill="#0F172A">latency_ms, tokens</text>
    <text x="600" y="220" text-anchor="middle" font-size="10" fill="#94A3B8">→ results.csv</text>
  </g>
  <g filter="url(#sh)">
    <rect x="510" y="280" width="180" height="80" rx="12" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="600" y="300" text-anchor="middle" font-size="11" font-family="monospace" fill="#0F172A">label, confidence,</text>
    <text x="600" y="317" text-anchor="middle" font-size="11" font-family="monospace" fill="#0F172A">latency_ms, tokens</text>
    <text x="600" y="340" text-anchor="middle" font-size="10" fill="#94A3B8">→ results.csv</text>
  </g>
  <g filter="url(#sh)">
    <rect x="510" y="400" width="180" height="80" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="600" y="420" text-anchor="middle" font-size="11" font-family="monospace" fill="#0F172A">label, confidence,</text>
    <text x="600" y="437" text-anchor="middle" font-size="11" font-family="monospace" fill="#0F172A">latency_ms, tokens</text>
    <text x="600" y="460" text-anchor="middle" font-size="10" fill="#94A3B8">→ results.csv</text>
  </g>
  <line x1="480" y1="200" x2="510" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="320" x2="510" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="440" x2="510" y2="440" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="690" y1="200" x2="780" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="320" x2="780" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="440" x2="780" y2="350" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#sh)">
    <rect x="780" y="270" width="240" height="100" rx="14" fill="#FDF2F8" stroke="#EC4899" stroke-width="2"/>
    <text x="900" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="#500724">Aggregator</text>
    <text x="900" y="325" text-anchor="middle" font-size="11" fill="#475569">accuracy · p50/p95</text>
    <text x="900" y="342" text-anchor="middle" font-size="11" fill="#475569">$/1K calls per provider</text>
    <text x="900" y="362" text-anchor="middle" font-size="10" fill="#94A3B8" font-style="italic">groupby(provider).agg(...)</text>
  </g>

  <g filter="url(#sh)">
    <rect x="700" y="430" width="380" height="180" rx="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="700" y="430" width="380" height="34" rx="14" fill="#1E293B"/>
    <rect x="700" y="450" width="380" height="14" fill="#1E293B"/>
    <text x="715" y="452" font-size="13" font-weight="700" fill="#FFFFFF">Comparison table - what students see</text>
    <text x="715" y="485" font-size="11" font-weight="700" fill="#475569">provider</text>
    <text x="855" y="485" font-size="11" font-weight="700" fill="#475569">acc</text>
    <text x="930" y="485" font-size="11" font-weight="700" fill="#475569">p95</text>
    <text x="1010" y="485" font-size="11" font-weight="700" fill="#475569">$/1K</text>
    <line x1="710" y1="495" x2="1070" y2="495" stroke="#E2E8F0"/>
    <text x="715" y="515" font-size="11" fill="#0F172A">gpt-5.4-mini</text>
    <text x="855" y="515" font-size="11" fill="#0F172A">90.0%</text>
    <text x="930" y="515" font-size="11" fill="#78350F" font-weight="600">4665 ms</text>
    <text x="1010" y="515" font-size="11" fill="#0F172A">$0.1293</text>
    <text x="715" y="540" font-size="11" fill="#0F172A">gpt-5.4-nano</text>
    <text x="855" y="540" font-size="11" fill="#064E3B" font-weight="600">93.3%</text>
    <text x="930" y="540" font-size="11" fill="#064E3B" font-weight="600">1185 ms</text>
    <text x="1010" y="540" font-size="11" fill="#0F172A">$0.0354</text>
    <text x="715" y="565" font-size="11" fill="#0F172A">qwen3:0.6b</text>
    <text x="855" y="565" font-size="11" fill="#78350F" font-weight="600">66.7%</text>
    <text x="930" y="565" font-size="11" fill="#0F172A">13071 ms</text>
    <text x="1010" y="565" font-size="11" fill="#064E3B" font-weight="600">$0.0000</text>
    <text x="900" y="595" text-anchor="middle" font-size="10" font-style="italic" fill="#94A3B8">numbers from a real 30-example run - yours will vary</text>
  </g>

  <text x="120" y="500" font-size="11" font-style="italic" fill="#78350F">⟲ Loop until every example is scored</text>
  <text x="550" y="625" text-anchor="middle" font-size="10" fill="#CBD5E1">CoreSmart GenAI Developer Course · Week 02</text>
</svg>