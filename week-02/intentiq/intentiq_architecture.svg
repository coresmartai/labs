<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="660" fill="url(#bg)"/>
  <text x="550" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">IntentIQ - One Interface, Three Backends</text>
  <text x="550" y="72" text-anchor="middle" font-size="14" fill="#64748B">One SDK (openai), three backends. Ollama exposes an OpenAI-compatible API, so the same library hits all three model providers.</text>

  <g filter="url(#sh)">
    <rect x="60" y="270" width="180" height="100" rx="14" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
    <text x="150" y="305" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">User message</text>
    <text x="150" y="330" text-anchor="middle" font-size="11" font-family="monospace" fill="#475569">"can you cancel</text>
    <text x="150" y="345" text-anchor="middle" font-size="11" font-family="monospace" fill="#475569">my plan?"</text>
    <text x="150" y="362" text-anchor="middle" font-size="10" fill="#94A3B8">→ classify intent</text>
  </g>
  <line x1="240" y1="320" x2="290" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#sh)">
    <rect x="290" y="220" width="240" height="200" rx="16" fill="#1E293B"/>
    <text x="410" y="255" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Provider Abstraction</text>
    <text x="410" y="276" text-anchor="middle" font-size="11" fill="#94A3B8">one interface · all providers</text>
    <line x1="320" y1="290" x2="500" y2="290" stroke="#334155"/>
    <text x="410" y="320" text-anchor="middle" font-size="12" font-family="monospace" fill="#A5F3FC">classify(provider, text)</text>
    <text x="410" y="340" text-anchor="middle" font-size="12" font-family="monospace" fill="#A5F3FC"> -&gt;</text>
    <text x="410" y="360" text-anchor="middle" font-size="12" font-family="monospace" fill="#A5F3FC">Result(label, confidence)</text>
  </g>

  <line x1="530" y1="280" x2="620" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="320" x2="620" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="360" x2="620" y2="470" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#sh)">
    <rect x="620" y="120" width="220" height="100" rx="14" fill="#DCFCE7" stroke="#10B981" stroke-width="2"/>
    <circle cx="660" cy="170" r="22" fill="#10B981"/>
    <text x="660" y="177" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">M</text>
    <text x="690" y="155" font-size="14" font-weight="700" fill="#064E3B">gpt-5.4-mini</text>
    <text x="690" y="173" font-size="11" fill="#475569">OpenAI · larger tier</text>
    <text x="690" y="190" font-size="10" font-family="monospace" fill="#64748B">api.openai.com</text>
    <text x="690" y="205" font-size="10" fill="#94A3B8">hosted · paid</text>
  </g>

  <g filter="url(#sh)">
    <rect x="620" y="270" width="220" height="100" rx="14" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="660" cy="320" r="22" fill="#8B5CF6"/>
    <text x="660" y="327" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">N</text>
    <text x="690" y="305" font-size="14" font-weight="700" fill="#4C1D95">gpt-5.4-nano</text>
    <text x="690" y="323" font-size="11" fill="#475569">OpenAI · smaller tier</text>
    <text x="690" y="340" font-size="10" font-family="monospace" fill="#64748B">api.openai.com</text>
    <text x="690" y="355" font-size="10" fill="#94A3B8">hosted · paid</text>
  </g>

  <g filter="url(#sh)">
    <rect x="620" y="420" width="220" height="100" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="660" cy="470" r="22" fill="#F59E0B"/>
    <text x="660" y="477" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Q</text>
    <text x="690" y="455" font-size="14" font-weight="700" fill="#451A03">qwen3:0.6b</text>
    <text x="690" y="473" font-size="11" fill="#475569">Ollama · local SLM</text>
    <text x="690" y="490" font-size="10" font-family="monospace" fill="#64748B">localhost:11434</text>
    <text x="690" y="505" font-size="10" fill="#94A3B8">self-hosted · free</text>
  </g>

  <line x1="840" y1="170" x2="920" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="320" x2="920" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="470" x2="920" y2="350" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#sh)">
    <rect x="920" y="270" width="160" height="100" rx="14" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>
    <text x="1000" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#500724">Benchmark</text>
    <text x="1000" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#500724">harness</text>
    <text x="1000" y="345" text-anchor="middle" font-size="10" fill="#475569">accuracy · latency</text>
    <text x="1000" y="360" text-anchor="middle" font-size="10" fill="#475569">cost per provider</text>
  </g>

  <g filter="url(#sh)">
    <rect x="350" y="490" width="240" height="80" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="470" y="520" text-anchor="middle" font-size="14" font-weight="700" fill="#451A03">golden_dataset.jsonl</text>
    <text x="470" y="540" text-anchor="middle" font-size="11" fill="#475569">~30 labelled examples</text>
    <text x="470" y="556" text-anchor="middle" font-size="10" fill="#94A3B8">the only ground truth</text>
  </g>
  <path d="M 590 530 Q 960 580 980 380" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="780" y="605" font-size="11" font-style="italic" fill="#78350F">expected labels feed every benchmark run</text>
  <text x="550" y="645" text-anchor="middle" font-size="10" fill="#CBD5E1">CoreSmart GenAI Developer Course · Week 02</text>
</svg>
