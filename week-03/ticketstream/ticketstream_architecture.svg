<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#F43F5E"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="600" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">TicketStream Architecture</text>
  <text x="600" y="70" text-anchor="middle" font-size="14" fill="#64748B">Validate first, stream second. Side effects gated behind a real Pydantic schema. The whole week's primitives in one service.</text>

  <!-- Top strip: what powers each block -->
  <g>
    <rect x="60" y="100" width="1080" height="40" rx="8" fill="#1E1B4B"/>
    <text x="200" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#CBD5E1">Block 1 - structured outputs (Pydantic)</text>
    <text x="490" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#FCD34D">Block 2 - tool calling</text>
    <text x="800" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#86EFAC">Block 3 - retries &amp; correction</text>
    <text x="1040" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#FCA5A5">Block 4 - SSE streaming</text>
  </g>

  <!-- Block 1: Intake Surface -->
  <g filter="url(#shadow)">
    <rect x="60" y="170" width="240" height="200" rx="16" fill="#FFFFFF" stroke="#475569" stroke-width="2.5"/>
    <circle cx="100" cy="208" r="22" fill="#475569"/>
    <text x="100" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">1</text>
    <text x="140" y="200" font-size="14" font-weight="700" fill="#0F172A">Intake Surface</text>
    <text x="140" y="220" font-size="11" fill="#64748B">POST /intake-stream</text>
    <text x="80" y="258" font-size="11" font-family="monospace" fill="#475569">{</text>
    <text x="95" y="273" font-size="11" font-family="monospace" fill="#475569">"message": "where is</text>
    <text x="95" y="288" font-size="11" font-family="monospace" fill="#475569"> order ORD-1042?",</text>
    <text x="95" y="303" font-size="11" font-family="monospace" fill="#475569">"customer_id": 8821,</text>
    <text x="95" y="318" font-size="11" font-family="monospace" fill="#475569">"provider": "openai"</text>
    <text x="80" y="333" font-size="11" font-family="monospace" fill="#475569">}</text>
    <text x="140" y="358" font-size="10" font-style="italic" fill="#94A3B8">raw, untrusted</text>
  </g>

  <!-- Arrow 1→2 -->
  <path d="M305 270 L350 270" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Block 2: Extract + Validate (largest, gate) -->
  <g filter="url(#shadow)">
    <rect x="360" y="170" width="320" height="280" rx="16" fill="#FFFBEB" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="400" cy="208" r="22" fill="#F59E0B"/>
    <text x="400" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">2</text>
    <text x="440" y="200" font-size="14" font-weight="700" fill="#451A03">Extract + Validate</text>
    <text x="440" y="220" font-size="11" fill="#64748B">(the Pydantic gate)</text>

    <!-- Tool call sub-box -->
    <g>
      <rect x="380" y="245" width="280" height="60" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="520" y="265" text-anchor="middle" font-size="11" font-weight="700" fill="#451A03">extract_ticket tool call</text>
      <text x="520" y="284" text-anchor="middle" font-size="10" font-family="monospace" fill="#475569">model → tool_calls {intent,</text>
      <text x="520" y="298" text-anchor="middle" font-size="10" font-family="monospace" fill="#475569">priority, customer_id, ...}</text>
    </g>

    <!-- Validation sub-box -->
    <g>
      <rect x="380" y="315" width="280" height="80" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
      <text x="520" y="335" text-anchor="middle" font-size="11" font-weight="700" fill="#064E3B">TicketSchema.model_validate(...)</text>
      <text x="520" y="352" text-anchor="middle" font-size="10" font-family="monospace" fill="#475569">discriminated Union[OrderIntent,</text>
      <text x="520" y="367" text-anchor="middle" font-size="10" font-family="monospace" fill="#475569">RefundIntent, BillingIntent]</text>
      <text x="520" y="385" text-anchor="middle" font-size="10" font-family="monospace" fill="#475569">priority: Literal["low"…"critical"]</text>
    </g>

    <text x="520" y="425" text-anchor="middle" font-size="11" font-weight="700" fill="#F59E0B">↺ retry-with-correction (cap 2)</text>
    <text x="520" y="440" text-anchor="middle" font-size="10" fill="#94A3B8">on ValidationError, embed error + retry</text>
  </g>

  <!-- Failure path: validation_failed -->
  <g>
    <path d="M520 460 L520 510" stroke="#F43F5E" stroke-width="2.5" marker-end="url(#arrow-rose)" stroke-dasharray="6 4"/>
    <rect x="430" y="510" width="180" height="50" rx="10" fill="#FEE2E2" stroke="#F43F5E" stroke-width="2"/>
    <text x="520" y="532" text-anchor="middle" font-size="11" font-weight="700" fill="#9F1239">event: validation_failed</text>
    <text x="520" y="548" text-anchor="middle" font-size="10" fill="#9F1239">stream closes; no routing</text>
  </g>

  <!-- Arrow 2→3 -->
  <path d="M685 280 L740 280" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="712" y="270" text-anchor="middle" font-size="10" font-weight="700" fill="#10B981">valid Ticket</text>

  <!-- Block 3: Field-by-Field Stream -->
  <g filter="url(#shadow)">
    <rect x="745" y="170" width="220" height="280" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
    <circle cx="785" cy="208" r="22" fill="#10B981"/>
    <text x="785" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">3</text>
    <text x="825" y="200" font-size="14" font-weight="700" fill="#064E3B">Field-by-Field</text>
    <text x="825" y="218" font-size="14" font-weight="700" fill="#064E3B">SSE Stream</text>

    <!-- Frames -->
    <g>
      <rect x="765" y="245" width="180" height="32" rx="6" fill="#FFFFFF" stroke="#10B981"/>
      <text x="775" y="266" font-size="11" font-family="monospace" fill="#064E3B">event: intent</text>

      <rect x="765" y="285" width="180" height="32" rx="6" fill="#FFFFFF" stroke="#10B981"/>
      <text x="775" y="306" font-size="11" font-family="monospace" fill="#064E3B">event: priority</text>

      <rect x="765" y="325" width="180" height="32" rx="6" fill="#FFFFFF" stroke="#10B981"/>
      <text x="775" y="346" font-size="11" font-family="monospace" fill="#064E3B">event: customer_id</text>

      <rect x="765" y="365" width="180" height="32" rx="6" fill="#FFFFFF" stroke="#10B981"/>
      <text x="775" y="386" font-size="11" font-family="monospace" fill="#064E3B">event: routed</text>

      <rect x="765" y="405" width="180" height="32" rx="6" fill="#0F172A"/>
      <text x="775" y="426" font-size="11" font-family="monospace" fill="#FCD34D">event: done</text>
    </g>
  </g>

  <!-- Arrow 3→4 -->
  <path d="M970 290 L1010 290" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="990" y="280" text-anchor="middle" font-size="10" font-weight="700" fill="#10B981">after</text>
  <text x="990" y="305" text-anchor="middle" font-size="10" font-weight="700" fill="#10B981">validation</text>

  <!-- Block 4: Side-effect tool -->
  <g filter="url(#shadow)">
    <rect x="1015" y="170" width="170" height="200" rx="16" fill="#FDF2F8" stroke="#EC4899" stroke-width="2.5"/>
    <circle cx="1055" cy="208" r="22" fill="#EC4899"/>
    <text x="1055" y="215" text-anchor="middle" font-size="18" font-weight="700" fill="#FFFFFF">4</text>
    <text x="1090" y="201" font-size="13" font-weight="700" fill="#500724">Side-Effect</text>
    <text x="1090" y="217" font-size="13" font-weight="700" fill="#500724">Tool</text>
    <text x="1100" y="252" text-anchor="middle" font-size="10" font-family="monospace" fill="#500724">route_to_team(</text>
    <text x="1100" y="266" text-anchor="middle" font-size="10" font-family="monospace" fill="#500724">  team,</text>
    <text x="1100" y="280" text-anchor="middle" font-size="10" font-family="monospace" fill="#500724">  priority</text>
    <text x="1100" y="294" text-anchor="middle" font-size="10" font-family="monospace" fill="#500724">)</text>
    <text x="1100" y="318" text-anchor="middle" font-size="10" fill="#475569">tenacity retry</text>
    <text x="1100" y="332" text-anchor="middle" font-size="10" fill="#475569">on transient fail</text>
    <text x="1100" y="354" text-anchor="middle" font-size="10" font-style="italic" fill="#9F1239">⚠ never called</text>
    <text x="1100" y="366" text-anchor="middle" font-size="10" font-style="italic" fill="#9F1239">without valid Ticket</text>
  </g>

  <text x="600" y="748" text-anchor="middle" font-size="11" fill="#94A3B8">CoreSmart GenAI Developer Course · Week 3</text>
</svg>
