    <!-- Student 1 → Student 4: payments outage -->
    <line x1="800" y1="410" x2="473" y2="587" stroke="#06B6D4" stroke-width="3" stroke-dasharray="6,3" opacity="0.7"/>
    <rect x="585" y="478" width="180" height="22" rx="6" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="675" y="494" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#083344">triage: payments outage</text>

    <!-- Student 6 → Student 2: auth service degraded -->
    <line x1="473" y1="233" x2="727" y2="587" stroke="#06B6D4" stroke-width="3" stroke-dasharray="6,3" opacity="0.7"/>
    <rect x="475" y="380" width="200" height="22" rx="6" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="575" y="396" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#083344">triage: auth service degraded</text>

    <!-- Student 7 → Student 5: cache miss spike -->
    <line x1="550" y1="160" x2="400" y2="410" stroke="#06B6D4" stroke-width="3" stroke-dasharray="6,3" opacity="0.7"/>
    <rect x="368" y="282" width="170" height="22" rx="6" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="453" y="298" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#083344">triage: cache miss spike</text>
