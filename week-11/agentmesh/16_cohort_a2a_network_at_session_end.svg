  <!-- caption -->
  <rect x="60" y="710" width="1080" height="40" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="600" y="734" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">What we built in 22 minutes. What you will operate for the rest of the course.</text>

  <text x="1100" y="745" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Applied GenAI &amp; Agentic AI Engineering Course · Week 11</text>
