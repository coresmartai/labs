    <circle cx="600" cy="160" r="50" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="600" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">Student 7</text>
    <text x="600" y="170" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#4F46E5">:8007</text>
    <text x="600" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">AgentMesh</text>

