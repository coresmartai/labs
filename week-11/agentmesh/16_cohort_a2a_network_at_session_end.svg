    <text x="100" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#92400E">published by Student 3</text>
    <line x1="160" y1="370" x2="300" y2="410" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="160" y1="370" x2="373" y2="233" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3"/>

    <rect x="40" y="430" width="120" height="40" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="447" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#451A03">MCP: incident_hist</text>
    <text x="100" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#92400E">published by Student 5</text>
    <line x1="160" y1="450" x2="300" y2="410" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="160" y1="450" x2="373" y2="587" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3"/>

    <rect x="1040" y="350" width="120" height="40" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
    <text x="1100" y="367" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#451A03">MCP: runbook_lib</text>
    <text x="1100" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#92400E">published by Student 8</text>
    <line x1="1040" y1="370" x2="900" y2="410" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="1040" y1="370" x2="827" y2="233" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3"/>

    <rect x="1040" y="430" width="120" height="40" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
    <text x="1100" y="447" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#451A03">MCP: ticket_search</text>
    <text x="1100" y="462" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#92400E">published by Student 7</text>
    <line x1="1040" y1="450" x2="900" y2="410" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="1040" y1="450" x2="827" y2="587" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3"/>
