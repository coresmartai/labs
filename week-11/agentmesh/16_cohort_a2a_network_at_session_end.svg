    <text x="350" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">Student 5</text>
    <text x="350" y="420" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#4F46E5">:8005</text>
    <text x="350" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">AgentMesh</text>

