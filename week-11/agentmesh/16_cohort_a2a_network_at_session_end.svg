  <!-- positions: 0deg right, going clockwise -->
  <g>
    <!-- 0deg: 850, 410 -->
    <circle cx="850" cy="410" r="50" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="850" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">Student 1</text>
    <text x="850" y="420" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#4F46E5">:8001</text>
    <text x="850" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">AgentMesh</text>

    <!-- 45deg: 777, 587 -->
    <circle cx="777" cy="587" r="50" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="777" y="582" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">Student 2</text>
    <text x="777" y="597" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#4F46E5">:8002</text>
    <text x="777" y="652" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">AgentMesh</text>

    <!-- 90deg: 600, 660 -->
    <circle cx="600" cy="660" r="50" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="600" y="655" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">Student 3</text>
    <text x="600" y="670" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#4F46E5">:8003</text>
    <text x="600" y="725" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">AgentMesh</text>

    <!-- 135deg: 423, 587 -->
    <circle cx="423" cy="587" r="50" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="423" y="582" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">Student 4</text>
