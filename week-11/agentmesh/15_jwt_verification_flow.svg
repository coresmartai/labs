<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#10B981"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#F43F5E"/>
    </marker>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#0F172A">JWT Verification Flow</text>
  <text x="600" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748B">Standard pattern · borrow it from any production API · JWKS cached 24h, not fetched per request</text>

  <!-- Three lanes -->
  <rect x="80" y="115" width="280" height="50" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="220" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">CLIENT</text>

  <rect x="460" y="115" width="280" height="50" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1E1B4B">AgentMesh service</text>

  <rect x="840" y="115" width="280" height="50" rx="12" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="980" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#083344">JWKS (OIDC provider)</text>

  <!-- lifelines -->
  <line x1="220" y1="165" x2="220" y2="610" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="600" y1="165" x2="600" y2="610" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="980" y1="165" x2="980" y2="610" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Step 1 -->
  <line x1="220" y1="210" x2="600" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="200" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#0F172A">POST /tasks  Authorization: Bearer eyJ...</text>
  <circle cx="40" cy="210" r="14" fill="#475569" filter="url(#shadow)"/>
  <text x="40" y="215" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1</text>

  <!-- Step 2 -->
  <line x1="600" y1="260" x2="980" y2="260" stroke="#4F46E5" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="790" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#1E1B4B">GET /.well-known/jwks.json</text>
  <text x="790" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-style="italic" fill="#94A3B8">only if cache miss (cached 24h)</text>
  <circle cx="40" cy="260" r="14" fill="#4F46E5" filter="url(#shadow)"/>
  <text x="40" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">2</text>

  <!-- Step 3 -->
  <line x1="980" y1="310" x2="600" y2="310" stroke="#06B6D4" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="790" y="300" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#083344">{ keys: [...public_keys] }</text>
  <circle cx="40" cy="310" r="14" fill="#06B6D4" filter="url(#shadow)"/>
  <text x="40" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">3</text>

  <!-- Step 4: internal verify -->
  <rect x="430" y="345" width="340" height="155" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="368" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E1B4B">Internal verification</text>
  <line x1="450" y1="378" x2="750" y2="378" stroke="#E5E7EB" stroke-width="1"/>
  <text x="450" y="400" font-family="JetBrains Mono, monospace" font-size="11" fill="#0F172A">1.  signature  ←  public keys</text>
  <text x="450" y="420" font-family="JetBrains Mono, monospace" font-size="11" fill="#0F172A">2.  audience  ==  "agentmesh"</text>
  <text x="450" y="440" font-family="JetBrains Mono, monospace" font-size="11" fill="#0F172A">3.  expiry  &gt;  now (+ leeway)</text>
  <text x="450" y="460" font-family="JetBrains Mono, monospace" font-size="11" fill="#0F172A">4.  scope  contains  "triage:invoke"</text>
  <text x="450" y="487" font-family="system-ui, sans-serif" font-size="10" font-style="italic" fill="#64748B">all 4 must pass - any failure = reject</text>
  <circle cx="40" cy="420" r="14" fill="#4F46E5" filter="url(#shadow)"/>
  <text x="40" y="425" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">4</text>

  <!-- Step 5a: valid (green) -->
  <line x1="600" y1="510" x2="600" y2="555" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrowg)"/>
  <rect x="430" y="555" width="340" height="40" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#064E3B">✓  valid → proceed with task</text>
  <circle cx="40" cy="575" r="14" fill="#10B981" filter="url(#shadow)"/>
  <text x="40" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">5</text>

  <!-- Step 5b: invalid (red) → back to client -->
  <line x1="600" y1="510" x2="220" y2="575" stroke="#F43F5E" stroke-width="2.5" marker-end="url(#arrowr)"/>
  <text x="370" y="540" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#9F1239">✗ invalid → 401 { reason }</text>

  <!-- Side annotations -->
  <rect x="60" y="640" width="540" height="65" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="80" y="665" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">JWKS caching</text>
  <text x="80" y="683" font-family="system-ui, sans-serif" font-size="10" fill="#475569">step 2-3 happen ~once per day, not per request</text>
  <text x="80" y="697" font-family="system-ui, sans-serif" font-size="10" fill="#475569">→ steady-state verification is local-only and fast</text>

  <rect x="620" y="640" width="520" height="65" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="640" y="665" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">Scope mapping</text>
  <text x="640" y="683" font-family="system-ui, sans-serif" font-size="10" fill="#475569">each A2A capability maps to a scope name</text>
  <text x="640" y="697" font-family="system-ui, sans-serif" font-size="10" fill="#475569">capability-level access control falls out for free</text>

  <text x="600" y="635" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Applied GenAI &amp; Agentic AI Engineering Course · Week 11</text>
</svg>
