<svg viewBox="0 0 1300 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1300" height="760" fill="url(#bg)"/>
  <text x="650" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#0F172A">AgentMesh Service Architecture</text>
  <text x="650" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748B">two protocols, one repo</text>

  <!-- Top band: client agents -->
  <text x="650" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#64748B">CLIENT AGENTS</text>
  <rect x="200" y="130" width="180" height="60" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Cursor</text>
  <text x="290" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">IDE-embedded</text>

  <rect x="560" y="130" width="180" height="60" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Custom Orchestrator</text>
  <text x="650" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">your team's runtime</text>

  <rect x="920" y="130" width="180" height="60" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2" filter="url(#shadow)"/>
  <text x="1010" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Peer Student</text>
  <text x="1010" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">cohort A2A network</text>

  <!-- Arrows down -->
  <line x1="290" y1="190" x2="290" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="190" x2="650" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1010" y1="190" x2="1010" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Middle band: AgentMesh service -->
  <rect x="80" y="240" width="1140" height="380" rx="18" fill="#EEF2FF" stroke="#4F46E5" stroke-width="3" filter="url(#shadow)"/>
  <text x="650" y="275" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#1E1B4B">AgentMesh service (FastAPI)</text>
  <text x="650" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#4F46E5">A2A-compatible · JWT-verified · SSE-streamed</text>

  <!-- 5 endpoints -->
  <rect x="120" y="320" width="200" height="70" rx="10" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2"/>
  <text x="220" y="345" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#083344">/.well-known/</text>
  <text x="220" y="362" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#083344">agent-card.json</text>
  <text x="220" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#06B6D4">discovery</text>

  <rect x="340" y="320" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <text x="430" y="345" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#1E1B4B">POST /tasks</text>
  <text x="430" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4F46E5">submit task</text>
  <text x="430" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">JWT + Pydantic validate</text>

  <rect x="540" y="320" width="220" height="70" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
  <text x="650" y="343" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#1E1B4B">GET /tasks/{id}/stream</text>
  <text x="650" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4F46E5">SSE state transitions</text>
  <text x="650" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">Last-Event-ID replay</text>

  <rect x="780" y="320" width="220" height="70" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="890" y="343" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#451A03">POST /tasks/{id}/input</text>
  <text x="890" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#F59E0B">human-in-the-loop reply</text>
  <text x="890" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">409 if not paused</text>

  <rect x="1020" y="320" width="160" height="70" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <text x="1100" y="345" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#475569">GET /health</text>
  <text x="1100" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#475569">liveness</text>
  <text x="1100" y="380" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">unauth, 200 OK</text>

  <!-- JWT verifier band -->
  <rect x="120" y="410" width="1060" height="50" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="650" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">🔒 JWT verifier (FastAPI dependency · runs before every protected endpoint)</text>
  <text x="650" y="448" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">JWKS-cached signature check · audience · expiry · scope</text>

  <!-- TriageFlow core -->
  <rect x="120" y="480" width="1060" height="120" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="510" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1E1B4B">TriageFlow core</text>
  <text x="650" y="528" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#4F46E5">3-step core: Triage → Knowledge / Action → Approval Gate → Compose</text>

  <rect x="170" y="545" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="260" y="570" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1E1B4B">Triage agent</text>

  <rect x="410" y="545" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="500" y="570" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#083344">Knowledge agent</text>

  <rect x="650" y="545" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="740" y="570" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#451A03">Action + Approval</text>

  <rect x="890" y="545" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#EC4899" stroke-width="1.5"/>
  <text x="980" y="570" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#500724">Compose</text>

  <!-- Cohort MCP server (co-hosted at /mcp; also runnable standalone) -->
  <line x1="980" y1="600" x2="1080" y2="660" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <rect x="950" y="660" width="280" height="70" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1090" y="685" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#451A03">Cohort MCP server</text>
  <text x="1090" y="703" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#92400E">co-hosted at /mcp · also standalone (stdio)</text>
  <text x="1090" y="718" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#92400E">4 tools · resources · prompts</text>

  <text x="900" y="630" font-family="system-ui, sans-serif" font-size="10" font-style="italic" fill="#92400E">MCP (stdio or Streamable HTTP)</text>

  <!-- Side annotations -->
  <rect x="80" y="660" width="280" height="70" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="100" y="685" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">✓ Two protocols, one repo</text>
  <text x="100" y="722" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0F172A">✓ JWT verified before every task</text>

  <text x="650" y="750" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Applied GenAI &amp; Agentic AI Engineering Course · Week 11</text>
</svg>
