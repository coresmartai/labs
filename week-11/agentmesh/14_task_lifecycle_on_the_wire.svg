<svg viewBox="0 0 1300 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1300" height="720" fill="url(#bg)"/>
  <text x="650" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#0F172A">Task Lifecycle on the Wire</text>
  <text x="650" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748B">One task · six state events · one human-in-the-loop pause · ~14s wall time</text>

  <!-- Three lanes -->
  <rect x="60" y="130" width="200" height="44" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="158" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Client orchestrator</text>

  <rect x="60" y="280" width="200" height="44" rx="10" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="308" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E1B4B">AgentMesh service</text>

  <rect x="60" y="430" width="200" height="44" rx="10" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="458" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#083344">TriageFlow core</text>

  <!-- Timeline ground lines -->
  <line x1="290" y1="152" x2="1260" y2="152" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="290" y1="302" x2="1260" y2="302" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="290" y1="452" x2="1260" y2="452" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Time axis -->
  <line x1="290" y1="540" x2="1260" y2="540" stroke="#475569" stroke-width="2"/>
  <text x="300" y="560" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">t=0</text>
  <text x="445" y="560" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">350ms</text>
  <text x="590" y="560" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">600ms</text>
  <text x="730" y="560" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">2s</text>
  <text x="950" y="560" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">14s (human approves)</text>
  <text x="1180" y="560" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">14.4s</text>

  <line x1="300" y1="535" x2="300" y2="545" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="535" x2="450" y2="545" stroke="#475569" stroke-width="2"/>
  <line x1="600" y1="535" x2="600" y2="545" stroke="#475569" stroke-width="2"/>
  <line x1="730" y1="535" x2="730" y2="545" stroke="#475569" stroke-width="2"/>
  <line x1="970" y1="535" x2="970" y2="545" stroke="#475569" stroke-width="2"/>
  <line x1="1180" y1="535" x2="1180" y2="545" stroke="#475569" stroke-width="2"/>

  <!-- Event 1: POST /tasks (client → service) -->
  <line x1="160" y1="174" x2="160" y2="280" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="170" y="220" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#1E1B4B">POST /tasks</text>
  <text x="170" y="234" font-family="system-ui, sans-serif" font-size="9" fill="#64748B">t=0 · client → service</text>

  <!-- Event 2: service → core invoke -->
  <line x1="305" y1="324" x2="305" y2="430" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="315" y="370" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#083344">run_triage()</text>

  <!-- SSE: submitted at t=20ms -->
  <circle cx="320" cy="302" r="6" fill="#475569"/>
  <text x="328" y="288" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#475569">TASK_STATE_SUBMITTED</text>
  <line x1="320" y1="296" x2="320" y2="200" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="326" y="195" font-family="system-ui, sans-serif" font-size="9" fill="#475569">→ client</text>

  <!-- working: triage classifying at t=80ms -->
  <circle cx="380" cy="302" r="6" fill="#4F46E5"/>
  <text x="388" y="324" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#1E1B4B">TASK_STATE_WORKING<tspan font-family="system-ui, sans-serif" font-weight="400" fill="#64748B"> · triage</tspan></text>
  <line x1="380" y1="296" x2="380" y2="200" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- working: action proposing at ~500ms -->
  <circle cx="500" cy="302" r="6" fill="#4F46E5"/>
  <text x="475" y="262" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#1E1B4B">TASK_STATE_WORKING</text>
  <text x="475" y="276" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">· action proposing</text>
  <line x1="500" y1="296" x2="500" y2="220" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- input-required at 2s -->
  <circle cx="740" cy="302" r="9" fill="#F59E0B"/>
  <text x="755" y="290" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#451A03">TASK_STATE_INPUT_REQUIRED</text>
  <text x="755" y="306" font-family="system-ui, sans-serif" font-size="10" fill="#92400E">human approval</text>
  <line x1="740" y1="294" x2="740" y2="200" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- pause indicator -->
  <rect x="750" y="320" width="220" height="100" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="860" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#451A03">⏸  paused</text>
  <text x="860" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#92400E">waiting on human · ~12s wall time</text>

  <!-- human reply -->
  <line x1="160" y1="174" x2="970" y2="280" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="170" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#451A03">POST /tasks/{id}/input  (approved: true)</text>
  <text x="500" y="184" font-family="system-ui, sans-serif" font-size="9" fill="#92400E">at t=14s · client → service</text>

  <!-- working: executing -->
  <circle cx="985" cy="302" r="6" fill="#4F46E5"/>
  <text x="993" y="297" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#1E1B4B">TASK_STATE_WORKING<tspan font-family="system-ui, sans-serif" font-weight="400" fill="#64748B"> · executing</tspan></text>
  <line x1="985" y1="296" x2="985" y2="220" stroke="#4F46E5" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- service to core resume -->
  <line x1="985" y1="324" x2="985" y2="430" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- completed -->
  <circle cx="1190" cy="302" r="10" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <text x="1265" y="270" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#064E3B">TASK_STATE_COMPLETED</text>
  <text x="1175" y="292" font-family="system-ui, sans-serif" font-size="10" fill="#064E3B">{ result: ... }</text>
  <line x1="1190" y1="293" x2="1190" y2="200" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="1100" y="195" font-family="system-ui, sans-serif" font-size="10" fill="#10B981">→ client receives action plan</text>

  <!-- Core processing bands -->
  <rect x="380" y="470" width="120" height="20" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
  <text x="440" y="484" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#1E1B4B">Triage ~350ms</text>
  <rect x="500" y="470" width="120" height="20" rx="4" fill="#ECFEFF" stroke="#06B6D4" stroke-width="1"/>
  <text x="560" y="484" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#083344">Action propose</text>
  <rect x="620" y="470" width="120" height="20" rx="4" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
  <text x="680" y="484" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#451A03">await approval</text>
  <rect x="985" y="470" width="200" height="20" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
  <text x="1085" y="484" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#064E3B">Action execute + Compose answer</text>

  <!-- caption -->
  <rect x="60" y="600" width="1180" height="70" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)"/>
  <text x="650" y="625" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">One task, six SSE events on the wire, one human-in-the-loop pause</text>
  <text x="650" y="645" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">The pause does not cost compute · TASK_STATE_INPUT_REQUIRED is the protocol's distinctive feature</text>
  <text x="650" y="662" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748B" font-style="italic">Last-Event-ID replay covers reconnects without losing context · state names are A2A v1.0 TaskState enum values (v0.3 used lowercase strings)</text>

  <text x="650" y="708" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">Applied GenAI &amp; Agentic AI Engineering Course · Week 11</text>
</svg>
