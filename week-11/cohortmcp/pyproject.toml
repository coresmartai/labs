[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohortmcp"
version = "0.1.0"
description = "A small MCP server exposing two cohort tools over stdio or Streamable HTTP."
requires-python = ">=3.10"
dependencies = ["mcp==1.28.1", "pydantic==2.11.7", "pydantic-settings==2.7.1"]

# The entrypoint. `pip install .` puts a `cohortmcp` command on PATH; this one
# line is the difference between a package and a runnable server.
[project.scripts]
cohortmcp = "app.mcp_server:main"

[tool.setuptools]
packages = ["app"]

# Without this the JSON fixtures stay behind on install and the tools break on
# import, which is exactly the failure the consumption check exists to catch.
[tool.setuptools.package-data]
app = ["data/*.json"]
