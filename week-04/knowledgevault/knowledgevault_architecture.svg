<text x="150" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#F8FAFC">Query</text>
<text x="150" y="430" text-anchor="middle" font-size="11" fill="#94A3B8">POST /retrieve</text>
<rect x="260" y="370" width="180" height="90" rx="12" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2" filter="url(#shadow)"/>
<text x="350" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#083344">Embed query</text>
<text x="350" y="430" text-anchor="middle" font-size="11" fill="#083344">text-embedding-3-large</text>
<line x1="240" y1="415" x2="260" y2="415" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="460" y="370" width="180" height="90" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/>
<text x="550" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">Dense (text)</text>
