<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 720" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#F8FAFC"/>
  <stop offset="100%" stop-color="#EEF2FF"/>
</linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
  <feOffset dx="0" dy="3" result="off"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
  <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
</marker>
<marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 Z" fill="#06B6D4"/>
</marker>
<marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 Z" fill="#4F46E5"/>
</marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 Z" fill="#F59E0B"/>
</marker>
</defs>
<rect width="1340" height="720" fill="url(#bg)"/>
<text x="670" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">KnowledgeVault Architecture</text>
<text x="670" y="68" text-anchor="middle" font-size="14" fill="#64748B">PDF → text vectors → dense + BM25 hybrid retrieval</text>
<text x="670" y="100" text-anchor="middle" font-size="14" fill="#475569" font-weight="700">INGEST PATH</text>
<rect x="60" y="130" width="180" height="90" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
<text x="150" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">PDF Source</text>
<text x="150" y="190" text-anchor="middle" font-size="11" fill="#0F172A">attention-is-all-you-need.pdf</text>
<rect x="260" y="130" width="180" height="90" rx="12" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2" filter="url(#shadow)"/>
<text x="350" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#083344">Parser</text>
<text x="350" y="190" text-anchor="middle" font-size="11" fill="#083344">PyMuPDF + pdfplumber</text>
