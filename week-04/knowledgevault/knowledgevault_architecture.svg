<rect x="660" y="130" width="180" height="90" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/>
<text x="750" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">Chunker</text>
<text x="750" y="190" text-anchor="middle" font-size="11" fill="#1E1B4B">300-token windows + metadata</text>
