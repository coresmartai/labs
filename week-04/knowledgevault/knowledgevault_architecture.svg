<rect x="860" y="370" width="180" height="90" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2" filter="url(#shadow)"/>
<text x="950" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#064E3B">Fusion (RRF)</text>
<text x="950" y="430" text-anchor="middle" font-size="11" fill="#064E3B">k=60 default · top-k</text>
<line x1="840" y1="415" x2="860" y2="415" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="1080" y="370" width="180" height="90" rx="12" fill="#FEE2E2" stroke="#F43F5E" stroke-width="2" filter="url(#shadow)"/>
<text x="1170" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#9F1239">Result</text>
<text x="1170" y="430" text-anchor="middle" font-size="11" fill="#9F1239">prose + figure + image_url</text>
<line x1="1040" y1="415" x2="1080" y2="415" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M 1170 370 C 1170 320 1170 270 1170 220" stroke="#06B6D4" stroke-width="2" stroke-dasharray="5 3" fill="none" marker-end="url(#arrow-cyan)"/>
<text x="1190" y="290" font-size="10" fill="#06B6D4" font-weight="700">query</text>
<rect x="80" y="510" width="1180" height="170" rx="14" fill="#FEE2E2" stroke="#F43F5E" stroke-width="2" filter="url(#shadow)"/>
<text x="670" y="540" text-anchor="middle" font-size="14" fill="#9F1239" font-weight="700">3 Deliberate Failure Modes (run them yourself)</text>
<circle cx="120" cy="575" r="14" fill="#F43F5E"/>
<text x="120" y="580" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="700">①</text>
<text x="148" y="580" font-size="13" fill="#9F1239" font-weight="700">Vision JSON parse</text>
<text x="148" y="597" font-size="11" fill="#475569">naïve prompt → no JSON → fix with structured schema + function-calling</text>
<circle cx="120" cy="610" r="14" fill="#F43F5E"/>
<text x="120" y="615" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="700">②</text>
<text x="148" y="615" font-size="13" fill="#9F1239" font-weight="700">Qdrant vector size mismatch</text>
<text x="148" y="632" font-size="11" fill="#475569">wrong embedding model → fix: re-run with --reset flag</text>
<circle cx="120" cy="645" r="14" fill="#F43F5E"/>
<text x="120" y="650" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="700">③</text>
<text x="148" y="650" font-size="13" fill="#9F1239" font-weight="700">Missing OPENAI_API_KEY</text>
<text x="148" y="667" font-size="11" fill="#475569">pydantic-settings raises at startup → fix in .env</text>
<text x="670" y="702" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Applied GenAI &amp; Agentic AI Engineering Course · Week 04</text>
</svg>
