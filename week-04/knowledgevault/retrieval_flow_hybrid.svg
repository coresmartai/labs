<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#F8FAFC"/>
  <stop offset="100%" stop-color="#ECFDF5"/>
</linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
  <feOffset dx="0" dy="3" result="off"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
  <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
</marker>
<marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 Z" fill="#06B6D4"/>
</marker>
<marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 Z" fill="#4F46E5"/>
</marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
  <path d="M0,0 L10,5 L0,10 Z" fill="#F59E0B"/>
</marker>
</defs>
<rect width="1400" height="820" fill="url(#bg)"/>

<!-- Title -->
<text x="700" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">Hybrid Retrieval with Reciprocal Rank Fusion</text>
<text x="700" y="68" text-anchor="middle" font-size="14" fill="#64748B">Two channels, one fusion - KnowledgeVault's retrieve(query, k=5)</text>

<!-- User query box (left) -->
<rect x="80" y="290" width="200" height="100" rx="14" fill="#0F172A" filter="url(#shadow)"/>
<text x="180" y="328" text-anchor="middle" font-size="14" fill="#F8FAFC" font-weight="700">User query</text>
<text x="180" y="350" text-anchor="middle" font-size="11" fill="#94A3B8">"failover sequence"</text>
<text x="180" y="370" text-anchor="middle" font-size="10" fill="#64748B" font-style="italic">k = 5</text>

<!-- Channel 1: Dense (text) -->
<path d="M 280 340 C 360 340 360 180 440 180" stroke="#06B6D4" stroke-width="3" fill="none" marker-end="url(#arrow-cyan)"/>
<rect x="440" y="140" width="280" height="80" rx="12" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2" filter="url(#shadow)"/>
<text x="580" y="172" text-anchor="middle" font-size="14" fill="#083344" font-weight="700">Dense (text)</text>
<text x="580" y="192" text-anchor="middle" font-size="11" fill="#083344">text-embedding-3-large</text>
<text x="580" y="210" text-anchor="middle" font-size="10" fill="#083344" font-style="italic">→ top-15 candidates (k×3)</text>
<path d="M 720 180 C 800 180 800 350 880 350" stroke="#06B6D4" stroke-width="2.5" fill="none"/>

<!-- Figures sub-lane - part of the dense text channel -->
<path d="M 280 340 C 360 340 360 340 440 340" stroke="#4F46E5" stroke-width="3" fill="none" marker-end="url(#arrow-indigo)"/>
<rect x="440" y="300" width="280" height="80" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/>
<text x="580" y="332" text-anchor="middle" font-size="14" fill="#1E1B4B" font-weight="700">Figures (text-desc) · text channel</text>
<text x="580" y="352" text-anchor="middle" font-size="11" fill="#1E1B4B">embedded via vision LLM description</text>
<text x="580" y="370" text-anchor="middle" font-size="10" fill="#1E1B4B" font-style="italic">→ rides the Dense (text) channel - no pixel data</text>
<path d="M 720 340 C 800 340 800 350 880 350" stroke="#4F46E5" stroke-width="2.5" fill="none"/>

<!-- Channel 3: Sparse (BM25) - moved up to y=460-540 -->
<path d="M 280 340 C 360 340 360 500 440 500" stroke="#F59E0B" stroke-width="3" fill="none" marker-end="url(#arrow-amber)"/>
<rect x="440" y="460" width="280" height="80" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
<text x="580" y="492" text-anchor="middle" font-size="14" fill="#451A03" font-weight="700">Sparse (BM25)</text>
<text x="580" y="512" text-anchor="middle" font-size="11" fill="#451A03">rank_bm25 inverted</text>
<text x="580" y="530" text-anchor="middle" font-size="10" fill="#451A03" font-style="italic">→ top-15 candidates (k×3)</text>
<path d="M 720 500 C 800 500 800 350 880 350" stroke="#F59E0B" stroke-width="2.5" fill="none"/>

<!-- RRF box (center) -->
<rect x="880" y="290" width="220" height="120" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="3" filter="url(#shadow)"/>
<text x="990" y="326" text-anchor="middle" font-size="15" fill="#064E3B" font-weight="700">Reciprocal Rank Fusion</text>
<text x="990" y="348" text-anchor="middle" font-size="11" fill="#064E3B" font-family="ui-monospace, monospace">score = Σ 1 / (k + rank_i)</text>
<text x="990" y="368" text-anchor="middle" font-size="11" fill="#064E3B">k = 60 (default)</text>
<text x="990" y="390" text-anchor="middle" font-size="10" fill="#475569" font-style="italic">rank-based - no normalization needed</text>

<line x1="1100" y1="350" x2="1170" y2="350" stroke="#10B981" stroke-width="3" marker-end="url(#arrow)"/>

<!-- Result chunks (right) -->
<rect x="1170" y="260" width="160" height="80" rx="10" fill="#FFFFFF" stroke="#06B6D4" stroke-width="2"/>
<text x="1250" y="282" text-anchor="middle" font-size="11" fill="#083344" font-weight="700">prose chunk</text>
<text x="1250" y="302" text-anchor="middle" font-size="10" fill="#475569">page 7 · "failover…"</text>
<text x="1250" y="320" text-anchor="middle" font-size="10" fill="#10B981" font-weight="700">RRF 0.0318</text>

<rect x="1170" y="360" width="160" height="90" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
<text x="1250" y="382" text-anchor="middle" font-size="11" fill="#1E1B4B" font-weight="700">figure chunk</text>
<rect x="1185" y="392" width="130" height="28" rx="4" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1"/>
<text x="1250" y="410" text-anchor="middle" font-size="9" fill="#1E1B4B">[image_url + caption]</text>
<text x="1250" y="438" text-anchor="middle" font-size="10" fill="#10B981" font-weight="700">RRF 0.0292</text>

<!-- Footer panel (moved to y=600-760) -->
<rect x="80" y="600" width="1280" height="155" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="100" y="630" font-size="13" fill="#0F172A" font-weight="700">Why RRF and not weighted score?</text>
<text x="100" y="657" font-size="12" fill="#475569">Dense cosine and BM25 produce wildly different score distributions. Combining by raw score requires per-channel normalization - a hyperparameter swamp.</text>
<text x="100" y="681" font-size="12" fill="#475569">RRF only cares about RANK within each channel, which is normalized by construction. Chunks that appear near the top across multiple channels win.</text>
<text x="100" y="710" font-size="12" fill="#10B981" font-weight="600">Want better? Add a cross-encoder re-ranker after fusion - that's something we will implement in upcoming weeks.</text>

<!-- Footer credit -->
<text x="700" y="795" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Applied GenAI &amp; Agentic AI Engineering Course · Week 04</text>
</svg>
