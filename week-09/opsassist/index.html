<!DOCTYPE html>
<!--
  Applied GenAI & Agentic AI Engineering Course UI Template
  Week 9 - OpsAssist (Agentic Loop From Scratch)
  ================================================
  HOW TO USE:
    1. Copy this file to your week's code folder, rename to index.html
    2. Replace every WEEK-SPECIFIC comment with your content
    3. Only edit inside WEEK-SPECIFIC START / WEEK-SPECIFIC END blocks
    4. Never modify the CORE sections

  Intentional deviations from the template (documented, not force-fit):
    1. Textarea labelled "Incident Description" - ops input, not release notes
    2. No streaming endpoint - /agent/run is a single blocking POST (loop runs server-side)
    3. Two extra input sections (User ID, Task ID) - agent session is scoped to a task
    4. Custom renderAgentResponse() renders final_response + trace cards, not raw JSON
    5. .left-panel has overflow-y: auto (3+ panel sections)

  See _templates/UI_DESIGN_GUIDE.md for the full design system.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- WEEK-SPECIFIC: Update title -->
  <title>Applied GenAI & Agentic AI Engineering Course Week 9</title>
  <style>
    /* ══════════════════════════════════════════════════════════════
       CORE - DO NOT EDIT (shared across all weeks)
       ══════════════════════════════════════════════════════════════ */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d1117;
      --surface:     #161b22;
      --surface-2:   #21262d;
      --surface-3:   #2d333b;
      --border:      #30363d;
      --text:        #e6edf3;
      --text-muted:  #7d8590;
      --blue:        #58a6ff;
      --blue-dim:    #1f3a5f;
      --green:       #3fb950;
      --green-dim:   #1a3a28;
      --red:         #f85149;
      --red-dim:     #3d1a1a;
      --orange:      #d29922;
      --radius:      8px;
      --mono:        'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-title {
      display: flex; align-items: center; gap: 10px;
      font-size: 15px; font-weight: 600; color: var(--text);
    }
    .header-title .logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, #1a56db, #7e3af2);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .week-badge {
      background: var(--blue-dim); color: var(--blue);
      font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 20px;
      border: 1px solid #1f4080;
    }
    .header-actions { display: flex; align-items: center; gap: 8px; }

    button {
      cursor: pointer; border: none; border-radius: var(--radius);
      font-size: 13px; font-weight: 500;
      transition: opacity 0.15s, transform 0.1s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .btn-ghost {
      background: transparent; color: var(--text-muted);
      border: 1px solid var(--border); padding: 6px 12px;
    }
    .btn-ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }

    .btn-primary { background: #1a56db; color: #fff; padding: 8px 16px; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }

    .btn-secondary {
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--border); padding: 8px 16px;
    }
    .btn-secondary:hover:not(:disabled) { background: var(--surface-3); }

    .btn-demo {
      background: transparent; color: var(--blue);
      border: 1px solid var(--blue-dim); padding: 5px 12px; font-size: 12px;
    }
    .btn-demo:hover:not(:disabled) { background: var(--blue-dim); }

    #health-chip {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 12px;
      font-size: 12px; font-weight: 500; cursor: pointer; color: var(--text-muted);
    }
    #health-chip:hover { background: var(--surface-3); }
    #health-chip.online  { color: var(--green); border-color: #1a4a2e; }
    #health-chip.offline { color: var(--red);   border-color: #4a1a1a; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
    .online  .dot { background: var(--green); box-shadow: 0 0 6px #3fb95088; animation: pulse 2s infinite; }
    .offline .dot { background: var(--red); }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    main {
      display: grid; grid-template-columns: 380px 1fr;
      flex: 1; overflow: hidden;
    }

    .left-panel {
      display: flex; flex-direction: column;
      border-right: 1px solid var(--border); overflow: hidden;
    }

    .panel-section { padding: 16px; border-bottom: 1px solid var(--border); }
    .panel-section:last-child { border-bottom: none; }

    label {
      display: block; font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--text-muted); margin-bottom: 8px;
    }

    textarea, input[type="email"], input[type="text"], select {
      width: 100%; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); font-size: 13px; font-family: inherit;
      outline: none; transition: border-color 0.15s;
    }
    textarea { resize: none; }
    textarea:focus, input:focus, select:focus {
      border-color: var(--blue); box-shadow: 0 0 0 3px #1a56db22;
    }

    #notes {
      flex: 1; min-height: 0; height: 0;
      padding: 10px 12px; line-height: 1.6;
    }

    input[type="email"], input[type="text"] { padding: 8px 12px; height: 38px; }
    select { padding: 8px 12px; height: 38px; cursor: pointer; }
    select option { background: var(--surface-2); }

    .input-row {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 8px;
    }

    .action-btns { display: flex; flex-direction: column; gap: 8px; padding: 16px; }
    .action-btns button { width: 100%; justify-content: center; }

    .right-panel { display: flex; flex-direction: column; overflow: hidden; }

    .pane { display: flex; flex-direction: column; overflow: hidden; }
    .pane-output { flex: 1; border-bottom: 1px solid var(--border); }
    .pane-logs   { height: 200px; flex-shrink: 0; }

    .pane-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: var(--text-muted); flex-shrink: 0;
    }

    .pane-body {
      flex: 1; overflow-y: auto; padding: 16px;
      font-family: var(--mono); font-size: 13px; line-height: 1.6;
    }
    .pane-body::-webkit-scrollbar { width: 6px; }
    .pane-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .placeholder-msg { color: var(--text-muted); font-family: inherit; font-size: 13px; font-style: italic; }

    .j-k    { color: #79c0ff; }
    .j-s    { color: #a5d6ff; }
    .j-n    { color: #ffa657; }
    .j-b    { color: #7ee787; }
    .j-null { color: var(--text-muted); }

    #output-body.streaming::after {
      content: '▋'; animation: blink 0.8s step-end infinite; color: var(--blue);
    }
    @keyframes blink { 50% { opacity: 0; } }

    .log-entry { display: flex; gap: 10px; padding: 2px 0; font-size: 12px; line-height: 1.5; }
    .log-ts    { color: var(--text-muted); flex-shrink: 0; }
    .log-level { font-weight: 700; flex-shrink: 0; width: 50px; }
    .log-msg   { color: var(--text); word-break: break-word; }
    .log-info    .log-level { color: var(--blue); }
    .log-success .log-level { color: var(--green); }
    .log-warn    .log-level { color: var(--orange); }
    .log-error   .log-level { color: var(--red); }

    .spinner {
      display: none; width: 14px; height: 14px;
      border: 2px solid var(--border); border-top-color: var(--blue);
      border-radius: 50%; animation: spin 0.6s linear infinite; flex-shrink: 0;
    }
    .spinner.active { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      background: var(--red-dim); border: 1px solid #6b2020;
      border-radius: var(--radius); padding: 12px;
      color: var(--red); font-family: var(--mono); font-size: 12px; white-space: pre-wrap;
    }

    /* ══════════════════════════════════════════════════════════════
       WEEK-SPECIFIC START - add new CSS classes here only
       ══════════════════════════════════════════════════════════════ */

    /* Left panel scrolls - 3+ panel sections */
    .left-panel { overflow-y: auto; }

    /* Scenario quick-fill pills */
    .scenario-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .pill {
      background: var(--surface-3); color: var(--text-muted);
      border: 1px solid var(--border); border-radius: 20px;
      padding: 3px 10px; font-size: 11px; cursor: pointer;
      transition: all 0.15s;
    }
    .pill:hover { background: var(--blue-dim); color: var(--blue); border-color: #1f4080; }

    /* Session fields row */
    .field-row { display: flex; gap: 8px; }
    .field-row > div { flex: 1; }
    .field-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }

    /* Stop-reason badge */
    .stop-badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 9px; border-radius: 20px;
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    }
    .stop-end_turn     { background: var(--green-dim); color: var(--green); border: 1px solid #1a4a2e; }
    .stop-max_iters    { background: #3a2800; color: var(--orange); border: 1px solid #5a3a00; }
    .stop-token_budget { background: #3a2800; color: var(--orange); border: 1px solid #5a3a00; }
    .stop-fatal_tool_error { background: var(--red-dim); color: var(--red); border: 1px solid #6b2020; }
    .stop-consent_revoked  { background: var(--red-dim); color: var(--red); border: 1px solid #6b2020; }
    .stop-timeout          { background: #3a2800; color: var(--orange); border: 1px solid #5a3a00; }

    /* Agent response card */
    .agent-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
    }
    .agent-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px; line-height: 1.75; white-space: pre-wrap;
      color: var(--text);
    }
    .agent-meta {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      font-size: 11px; color: var(--text-muted); margin-top: 12px;
      padding-top: 10px; border-top: 1px solid var(--border);
    }

    /* Trace */
    .trace-toggle {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--text-muted);
      margin-bottom: 8px; cursor: pointer; user-select: none;
      display: flex; align-items: center; gap: 6px;
    }
    .trace-toggle:hover { color: var(--text); }
    .trace-list { display: flex; flex-direction: column; gap: 6px; }
    .trace-iter {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 6px; padding: 10px 12px;
    }
    .trace-iter-head {
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--text-muted); margin-bottom: 4px;
    }
    .trace-iter-head span:first-child { font-weight: 700; color: var(--blue); }
    .tool-pill {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--blue-dim); color: var(--blue);
      border: 1px solid #1f4080; border-radius: 4px;
      padding: 2px 8px; font-size: 11px; font-family: var(--mono); margin: 2px 2px 0;
    }
    .tool-pill.err { background: var(--red-dim); color: var(--red); border-color: #6b2020; }
    .final-turn { font-size: 11px; color: var(--text-muted); margin-top: 2px; font-style: italic; }

    /* ══════════════════════════════════════════════════════════════
       WEEK-SPECIFIC END
       ══════════════════════════════════════════════════════════════ */
  </style>
</head>
<body>

<!-- ── CORE: Header ──────────────────────────────────────────────── -->
<header>
  <div class="header-title">
    <div class="logo">🤖</div>
    Applied GenAI & Agentic AI Engineering Course
    <span class="week-badge">Week 9</span>
    <span class="header-sub">- OpsAssist</span>
  </div>
  <div class="header-actions">
    <button class="btn-ghost" onclick="window.open('/readme','_blank')">📖 README</button>
    <div id="health-chip" onclick="checkHealth()" title="Click to re-check">
      <span class="dot"></span>
      <span id="health-text">Checking…</span>
    </div>
  </div>
</header>

<!-- ── Main layout ─────────────────────────────────────────────── -->
<main>

  <!-- Left panel -->
  <div class="left-panel">

    <!-- CORE: Primary input - id="notes" must stay -->
    <div class="panel-section" style="flex:1; display:flex; flex-direction:column; min-height:180px;">
      <div class="input-row">
        <label style="margin:0">Incident Description</label>
        <button class="btn-demo" onclick="fillDemo()">↺ Fill Demo</button>
      </div>
      <textarea id="notes" placeholder="Describe the service issue - e.g. auth-service latency has spiked in the last hour, p95 over 400ms. Investigate and propose a remediation."></textarea>

      <!-- WEEK-SPECIFIC START: quick-fill scenario pills -->
      <div class="scenario-pills">
        <span class="pill" onclick="fillScenario(0)">Auth Latency</span>
        <span class="pill" onclick="fillScenario(1)">API Error Spike</span>
        <span class="pill" onclick="fillScenario(2)">Queue Backlog</span>
        <span class="pill" onclick="fillScenario(3)">DB Exhaustion</span>
      </div>
      <!-- WEEK-SPECIFIC END -->
    </div>

    <!-- WEEK-SPECIFIC START: session options -->
    <div class="panel-section">
      <label>Session Options</label>
      <div class="field-row">
        <div>
          <div class="field-label">User ID</div>
          <input type="text" id="user-id" value="demo" placeholder="demo" />
        </div>
        <div>
          <div class="field-label">Task ID <span style="font-weight:400;text-transform:none;">(optional - resumes state)</span></div>
          <input type="text" id="task-id" placeholder="auto-generated" />
        </div>
      </div>
    </div>
    <!-- WEEK-SPECIFIC END -->

    <!-- CORE: Action buttons -->
    <div class="action-btns">
      <button class="btn-primary" id="btn-main" onclick="doMain()">
        <span id="spin-m" class="spinner"></span>
        🔁 &nbsp;Run Agent
      </button>
    </div>

  </div>

  <!-- Right panel (CORE - do not change structure) -->
  <div class="right-panel">

    <div class="pane pane-output">
      <div class="pane-header">
        Output
        <div style="display:flex;gap:8px;align-items:center">
          <span id="output-tag" style="font-size:11px;color:var(--text-muted)"></span>
          <button class="btn-ghost" style="padding:3px 10px;font-size:11px;display:none" id="btn-format" onclick="toggleFormat()">{ } Format</button>
          <button class="btn-ghost" style="padding:3px 10px;font-size:11px" onclick="clearOutput()">✕ Clear</button>
        </div>
      </div>
      <div class="pane-body" id="output-body">
        <span class="placeholder-msg">Run an incident to see the agent's response and trace here…</span>
      </div>
    </div>

    <div class="pane pane-logs">
      <div class="pane-header">
        Logs
        <button class="btn-ghost" style="padding:3px 10px;font-size:11px" onclick="clearLogs()">✕ Clear</button>
      </div>
      <div class="pane-body" id="logs-body">
        <span class="placeholder-msg">Request logs will appear here…</span>
      </div>
    </div>

  </div>
</main>

<script>
  /* ══════════════════════════════════════════════════════════════════
     CORE - DO NOT EDIT (shared across all weeks)
     ════════════════════════════════════════════════════════════════ */

 const API = (location.origin && location.origin.startsWith('http')) ? location.origin : 'http://localhost:8000';

  let _rawOutputText = '';
  let _isFormatted   = false;

  /** Convert any FastAPI `detail` value to a readable string.
   *  Handles: string (normal errors), array (Pydantic 422), object (fallback). */
  function _fmtDetail(detail, fallback) {
    if (!detail) return fallback || 'Unknown error';
    if (typeof detail === 'string') return detail;
    if (Array.isArray(detail))
      return detail.map(d => d.msg || JSON.stringify(d)).join(' | ');
    return JSON.stringify(detail);
  }

  function _showFormatBtn(show) {
    document.getElementById('btn-format').style.display = show ? '' : 'none';
    _isFormatted = false;
    document.getElementById('btn-format').textContent = '{ } Format';
  }

  function toggleFormat() {
    const body = document.getElementById('output-body');
    const btn  = document.getElementById('btn-format');
    if (!_isFormatted) {
      let src = _rawOutputText.trim();
      if (src.startsWith('```')) {
        const inner = src.split('```')[1] || '';
        src = inner.startsWith('json') ? inner.slice(4).trim() : inner.trim();
      }
      try {
        body.innerHTML = `<pre>${highlightJSON(JSON.parse(src))}</pre>`;
        _isFormatted = true; btn.textContent = '≡ Raw';
        addLog('info', 'Output formatted as JSON.');
      } catch { addLog('warn', 'Could not parse output as JSON.'); }
    } else {
      body.textContent = _rawOutputText;
      _isFormatted = false; btn.textContent = '{ } Format';
    }
  }

  async function checkHealth() {
    const chip = document.getElementById('health-chip');
    const txt  = document.getElementById('health-text');
    chip.className = ''; txt.textContent = 'Checking…';
    try {
      const r    = await fetch(`${API}/health`);
      const data = await r.json();
      chip.className  = 'online';
      txt.textContent = `Online · ${data.model}`;
      addLog('success', `Health OK - model: ${data.model}`);
    } catch (e) {
      chip.className  = 'offline';
      txt.textContent = 'Offline';
      addLog('error', `Health check failed - is the server running? (${e.message})`);
    }
  }

  function clearOutput() {
    document.getElementById('output-body').innerHTML =
      '<span class="placeholder-msg">Run an incident to see the agent\'s response and trace here…</span>';
    document.getElementById('output-tag').textContent = '';
    _rawOutputText = ''; _showFormatBtn(false);
  }

  function clearLogs() {
    document.getElementById('logs-body').innerHTML =
      '<span class="placeholder-msg">Request logs will appear here…</span>';
  }

  function addLog(level, msg) {
    const body = document.getElementById('logs-body');
    const ph   = body.querySelector('.placeholder-msg');
    if (ph) ph.remove();
    const now = new Date().toLocaleTimeString('en-GB', {hour12: false});
    const div = document.createElement('div');
    div.className = `log-entry log-${level}`;
    div.innerHTML =
      `<span class="log-ts">${now}</span>` +
      `<span class="log-level">${level.toUpperCase()}</span>` +
      `<span class="log-msg">${escHtml(msg)}</span>`;
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
  }

  function highlightJSON(obj) {
    const str = JSON.stringify(obj, null, 2);
    return escHtml(str).replace(
      /(&quot;(?:\\u[0-9a-fA-F]{4}|\\[^u]|[^\\&])*&quot;(?:\s*:)?|\b(?:true|false)\b|\bnull\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
      match => {
        let c = 'n';
        if (match.startsWith('&quot;'))
          c = match.endsWith(':') ? 'k' : 's';
        else if (match === 'true' || match === 'false') c = 'b';
        else if (match === 'null') c = 'null';
        return `<span class="j-${c}">${match}</span>`;
      }
    );
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function setLoading(active) {
    document.querySelectorAll('.action-btns button').forEach(b => b.disabled = active);
    document.querySelectorAll('.spinner').forEach(s => s.classList.toggle('active', active));
  }

  /* ══════════════════════════════════════════════════════════════════
     WEEK-SPECIFIC START - Week 9 / OpsAssist
     ════════════════════════════════════════════════════════════════ */

  // Default demo - loads when Fill Demo is clicked
  const DEMO_NOTES = 'auth-service latency has spiked in the last hour. p95 is over 400ms. Investigate and propose a remediation.';

  // Quick-fill scenarios - match the four runbooks in tools.py
  const DEMOS = [
    'auth-service latency has spiked in the last hour. p95 is over 400ms. Investigate and propose a remediation.',
    'Error rate on the API service is elevated over the last 5 minutes. Diagnose and recommend next steps.',
    'Worker queue backlog is growing. Investigate the cause and propose a scale action.',
    'Database connection pool is exhausted. Identify which client is causing the leak and propose a fix.',
  ];

  function fillDemo() {
    document.getElementById('notes').value = DEMO_NOTES;
    addLog('info', 'Demo input loaded - auth-service latency scenario.');
  }

  function fillScenario(i) {
    document.getElementById('notes').value = DEMOS[i];
    const labels = ['Auth Latency', 'API Error Spike', 'Queue Backlog', 'DB Exhaustion'];
    addLog('info', `Scenario loaded: ${labels[i]}.`);
  }

  // Primary action - POST /agent/run
  async function doMain() {
    const input  = document.getElementById('notes').value.trim();
    if (!input) { addLog('warn', 'Incident description is empty.'); return; }

    const userId = document.getElementById('user-id').value.trim() || 'demo';
    const taskId = document.getElementById('task-id').value.trim() || null;

    clearOutput(); setLoading(true);
    document.getElementById('output-tag').textContent = '/agent/run';
    addLog('info', `POST /agent/run - user_id: ${escHtml(userId)}${taskId ? ', task_id: ' + escHtml(taskId) : ' (new task)'}`);

    try {
      const payload = { user_input: input, user_id: userId };
      if (taskId) payload.task_id = taskId;

      const r = await fetch(`${API}/agent/run`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(_fmtDetail(data.detail, r.statusText));

      renderAgentResponse(data);
      _rawOutputText = JSON.stringify(data, null, 2);
      _showFormatBtn(true);

      const totalTok = data.trace.reduce((s, t) => s + t.model_request_tokens + t.model_response_tokens, 0);
      addLog('success', `Done - stop: ${data.stop_reason} | iters: ${data.iter_count} | tokens: ${totalTok}`);
    } catch (e) {
      document.getElementById('output-body').innerHTML = `<div class="error-box">${escHtml(e.message)}</div>`;
      addLog('error', e.message);
    } finally {
      setLoading(false);
    }
  }

  // Render agent response - custom for W9 (trace cards, stop-reason badge)
  function renderAgentResponse(data) {
    const body = document.getElementById('output-body');

    const stopClass = `stop-${data.stop_reason}`;
    const stopLabel = data.stop_reason.replace(/_/g, ' ');
    const totalTok  = data.trace.reduce((s, t) => s + t.model_request_tokens + t.model_response_tokens, 0);

    // Trace iterations
    const traceHtml = data.trace.map(it => {
      const toolsHtml = it.tool_calls.map(tc => {
        const res    = it.tool_results.find(r => r.tool_call_id === tc.id);
        const isErr  = res && res.is_error;
        return `<span class="tool-pill${isErr ? ' err' : ''}">${escHtml(tc.name)}</span>`;
      }).join('');

      const iterTok = it.model_request_tokens + it.model_response_tokens;
      return `
        <div class="trace-iter">
          <div class="trace-iter-head">
            <span>Iter ${it.iter}</span>
            <span>${it.elapsed_ms} ms &nbsp;·&nbsp; ${iterTok} tok</span>
          </div>
          ${toolsHtml
            ? `<div>${toolsHtml}</div>`
            : `<div class="final-turn">↳ final turn - no tool calls</div>`}
        </div>`;
    }).join('');

    body.innerHTML = `
      <div class="agent-card">
        <div class="agent-text">${escHtml(data.final_response)}</div>
        <div class="agent-meta">
          <span class="stop-badge ${stopClass}">${escHtml(stopLabel)}</span>
          <span>⟳ ${data.iter_count} iter${data.iter_count !== 1 ? 's' : ''}</span>
          <span>🪙 ${totalTok} tokens</span>
        </div>
      </div>
      <div class="trace-toggle" onclick="
        const t = this.nextElementSibling;
        const open = t.style.display !== 'none';
        t.style.display = open ? 'none' : '';
        this.textContent = (open ? '▸' : '▾') + this.textContent.slice(1);
      ">▾ Trace - ${data.trace.length} iteration${data.trace.length !== 1 ? 's' : ''}</div>
      <div class="trace-list">${traceHtml}</div>
    `;
  }

  /* ══════════════════════════════════════════════════════════════════
     CORE: Init - always runs on load, do not remove
     ════════════════════════════════════════════════════════════════ */
  checkHealth();
</script>
</body>
</html>
