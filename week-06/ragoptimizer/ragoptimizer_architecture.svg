<svg viewBox="0 0 1320 760" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#CBD5E1"/>
    </marker>
  </defs>

  <rect width="1320" height="760" fill="url(#bg)"/>

  <!-- Title -->
  <text x="660" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#0F172A">RAGOptimizer Architecture: CitationRAG + 3 new modules</text>
  <text x="660" y="73" text-anchor="middle" font-size="14" fill="#64748B">Grey = CitationRAG inherited  ·  Coloured = RAGOptimizer new wiring</text>

  <!-- ===== Baseline strip (left) + Legend (right) ===== -->
  <text x="40" y="112" font-size="13" font-weight="700" fill="#94A3B8">CitationRAG baseline path (preserved, runs alongside)</text>
  <g opacity="0.65">
    <rect x="40"  y="122" width="156" height="50" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="118" y="151" text-anchor="middle" font-size="12" fill="#64748B">User query</text>
    <line x1="196" y1="147" x2="214" y2="147" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow-grey)"/>

    <rect x="216" y="122" width="156" height="50" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="294" y="151" text-anchor="middle" font-size="12" fill="#64748B">Embed query</text>
    <line x1="372" y1="147" x2="390" y2="147" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow-grey)"/>

    <rect x="392" y="122" width="156" height="50" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="470" y="144" text-anchor="middle" font-size="12" fill="#64748B">Hybrid top-5</text>
    <text x="470" y="160" text-anchor="middle" font-size="9"  fill="#94A3B8">dense + BM25 + RRF</text>
    <line x1="548" y1="147" x2="566" y2="147" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow-grey)"/>

    <rect x="568" y="122" width="156" height="50" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="646" y="151" text-anchor="middle" font-size="12" fill="#64748B">Citation prompt</text>
    <line x1="724" y1="147" x2="742" y2="147" stroke="#CBD5E1" stroke-width="2" marker-end="url(#arrow-grey)"/>

    <rect x="744" y="122" width="166" height="50" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="827" y="151" text-anchor="middle" font-size="12" fill="#64748B">Validator + ground</text>
  </g>

  <!-- Legend -->
  <rect x="1010" y="98" width="270" height="90" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1026" y="120" font-size="12" font-weight="700" fill="#0F172A">Layer colours</text>
  <circle cx="1034" cy="140" r="6" fill="#4F46E5"/><text x="1048" y="144" font-size="11" fill="#475569">Model</text>
  <circle cx="1034" cy="162" r="6" fill="#06B6D4"/><text x="1048" y="166" font-size="11" fill="#475569">Retrieval</text>
  <circle cx="1034" cy="182" r="6" fill="#F59E0B"/><text x="1048" y="186" font-size="11" fill="#475569">Rerank</text>
  <circle cx="1150" cy="140" r="6" fill="#10B981"/><text x="1164" y="144" font-size="11" fill="#475569">Compress</text>
  <circle cx="1150" cy="162" r="6" fill="#EC4899"/><text x="1164" y="166" font-size="11" fill="#475569">HyDE + original</text>
  <circle cx="1150" cy="182" r="6" fill="#CBD5E1"/><text x="1164" y="186" font-size="11" fill="#475569">CitationRAG inherited</text>

  <!-- ===== RAGOptimizer path ===== -->
  <text x="40" y="222" font-size="14" font-weight="700" fill="#0F172A">RAGOptimizer path: three new modules wired into the same service</text>

  <!-- ROW 1 (left → right) : boxes 186 wide, step 210, y 240..340 -->
  <!-- 1 User query -->
  <g filter="url(#shadow)"><rect x="40" y="240" width="186" height="100" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/></g>
  <text x="133" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">User query</text>
  <text x="133" y="307" text-anchor="middle" font-size="11" fill="#475569">app/main.py</text>
  <line x1="228" y1="290" x2="248" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 HyDE probe -->
  <g filter="url(#shadow)"><rect x="250" y="240" width="186" height="100" rx="12" fill="#FDF2F8" stroke="#EC4899" stroke-width="2.5"/></g>
  <circle cx="274" cy="264" r="11" fill="#EC4899"/><text x="274" y="268" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">★</text>
  <text x="352" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#500724">HyDE probe</text>
  <text x="343" y="288" text-anchor="middle" font-size="10" fill="#475569">app/hyde.py · gpt-5.4-nano</text>
  <text x="343" y="304" text-anchor="middle" font-size="10" fill="#475569">original query runs in parallel</text>
  <text x="343" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="#EC4899">+1 small-model call</text>
  <line x1="438" y1="290" x2="458" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 Search x2 -->
  <g filter="url(#shadow)"><rect x="460" y="240" width="186" height="100" rx="12" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2"/></g>
  <text x="553" y="283" text-anchor="middle" font-size="14" font-weight="700" fill="#083344">Search ×2 (top-30)</text>
  <text x="553" y="305" text-anchor="middle" font-size="10" fill="#475569">probe→dense · query→hybrid</text>
  <line x1="648" y1="290" x2="668" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 Union + dedupe -->
  <g filter="url(#shadow)"><rect x="670" y="240" width="186" height="100" rx="12" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2"/></g>
  <text x="763" y="283" text-anchor="middle" font-size="14" font-weight="700" fill="#083344">Union + dedupe</text>
  <text x="763" y="305" text-anchor="middle" font-size="10" fill="#475569">by chunk-ID · top-30 WIDE</text>
  <line x1="858" y1="290" x2="878" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5 Reranker -->
  <g filter="url(#shadow)"><rect x="880" y="240" width="186" height="100" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/></g>
  <circle cx="904" cy="264" r="11" fill="#F59E0B"/><text x="904" y="268" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">⚡</text>
  <text x="982" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#451A03">Reranker</text>
  <text x="973" y="288" text-anchor="middle" font-size="10" fill="#475569">app/reranker.py</text>
  <text x="973" y="304" text-anchor="middle" font-size="10" fill="#475569">bge-reranker-base · batched</text>
  <text x="973" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="#F59E0B">+110 ms</text>
  <line x1="1068" y1="290" x2="1088" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6 Top-5 -->
  <g filter="url(#shadow)"><rect x="1090" y="240" width="186" height="100" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/></g>
  <text x="1183" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#451A03">Top-5</text>
  <text x="1183" y="307" text-anchor="middle" font-size="11" fill="#475569">inject NARROW</text>

  <!-- Down connector Top-5 -> Compressor -->
  <polyline points="1183,340 1183,372 1162,372 1162,398" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ROW 2 (right → left) : boxes 228 wide, step 252, y 400..500 -->
  <!-- 5 Compressor (right) -->
  <g filter="url(#shadow)"><rect x="1048" y="400" width="228" height="100" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/></g>
  <circle cx="1073" cy="424" r="11" fill="#10B981"/><text x="1073" y="428" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">⚡</text>
  <text x="1170" y="428" text-anchor="middle" font-size="14" font-weight="700" fill="#064E3B">Compressor</text>
  <text x="1162" y="448" text-anchor="middle" font-size="10" fill="#475569">app/compressor.py · extractive</text>
  <text x="1162" y="464" text-anchor="middle" font-size="10" fill="#475569">preserve citation IDs</text>
  <text x="1162" y="485" text-anchor="middle" font-size="11" font-weight="700" fill="#10B981">+40 ms · −20% tokens (keep 0.80)</text>
  <line x1="1048" y1="450" x2="1026" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4 Citation prompt -->
  <g filter="url(#shadow)"><rect x="796" y="400" width="228" height="100" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/></g>
  <text x="910" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">Citation prompt</text>
  <line x1="796" y1="450" x2="774" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3 gpt-5.4-mini -->
  <g filter="url(#shadow)"><rect x="544" y="400" width="228" height="100" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/></g>
  <circle cx="569" cy="450" r="11" fill="#4F46E5"/><text x="569" y="454" text-anchor="middle" font-size="11" fill="#FFFFFF" font-weight="700">★</text>
  <text x="666" y="446" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">gpt-5.4-mini</text>
  <text x="666" y="466" text-anchor="middle" font-size="11" fill="#475569">app/llm.py (pinned)</text>
  <line x1="544" y1="450" x2="522" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2 Validator + ground -->
  <g filter="url(#shadow)"><rect x="292" y="400" width="228" height="100" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/></g>
  <text x="406" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#1E1B4B">Validator + ground</text>
  <line x1="292" y1="450" x2="270" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 1 Response (left) -->
  <g filter="url(#shadow)"><rect x="40" y="400" width="228" height="100" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/></g>
  <text x="154" y="446" text-anchor="middle" font-size="14" font-weight="700" fill="#064E3B">Response</text>
  <text x="154" y="466" text-anchor="middle" font-size="11" fill="#475569">cited, grounded</text>

  <!-- ===== Eval callout ===== -->
  <g filter="url(#shadow)"><rect x="40" y="558" width="1240" height="140" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/></g>
  <text x="660" y="592" text-anchor="middle" font-size="16" font-weight="700" fill="#451A03">POST /eval/compare: runs BOTH pipelines against the 10-question golden set, returns paired metrics</text>
  <text x="660" y="622" text-anchor="middle" font-size="13" fill="#334155">groundedness   ·   citation_validity   ·   citation_recall   ·   false_answer_rate   ·   false_refusal_rate</text>
  <text x="660" y="650" text-anchor="middle" font-size="13" fill="#475569">Baseline column = CitationRAG (hybrid + gate)   ·   Full column = RAGOptimizer (HyDE + hybrid + cross-encoder rerank + extractive compression)</text>
  <text x="660" y="678" text-anchor="middle" font-size="12" font-style="italic" fill="#94A3B8">Same questions through both pipelines. Same Qdrant collection.</text>

  <text x="660" y="732" text-anchor="middle" font-size="11" fill="#94A3B8">Applied GenAI &amp; Agentic AI Engineering Course · Week 06</text>
</svg>
