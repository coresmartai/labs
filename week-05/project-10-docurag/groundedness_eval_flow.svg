<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="660" fill="url(#bg)"/>

  <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">Groundedness Eval Flow</text>
  <text x="600" y="74" text-anchor="middle" font-size="14" fill="#64748B">A dataset built from your own indexed chunks becomes the measurement instrument for your current project.</text>

  <!-- Golden dataset -->
  <g filter="url(#shadow)">
    <rect x="50" y="180" width="200" height="220" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <text x="150" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Golden dataset</text>
    <text x="150" y="226" text-anchor="middle" font-size="9" font-style="italic" fill="#94A3B8">generated from indexed chunks</text>
    <text x="150" y="238" text-anchor="middle" font-size="9" font-style="italic" fill="#94A3B8">by scripts/build_golden_dataset.py</text>
    <line x1="65" y1="246" x2="235" y2="246" stroke="#CBD5E1"/>
    <text x="75" y="260" font-size="10" fill="#475569">{</text>
    <text x="85" y="276" font-size="10" fill="#1E293B">"question": "...",</text>
    <text x="85" y="292" font-size="10" fill="#1E293B">"expected_answer":</text>
    <text x="100" y="306" font-size="10" fill="#1E293B">"...",</text>
    <text x="85" y="322" font-size="10" fill="#1E293B">"must_cite":</text>
    <text x="100" y="336" font-size="10" fill="#1E293B">["_answered"]</text>
    <text x="75" y="352" font-size="10" fill="#475569">}</text>
    <text x="150" y="382" text-anchor="middle" font-size="10" fill="#94A3B8" font-style="italic">10 rows total</text>
  </g>

  <!-- Loop arrow -->
  <path d="M250 290 L290 290" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="270" y="280" text-anchor="middle" font-size="10" fill="#475569">for row</text>

  <!-- Loop block (dashed) -->
  <g>
    <rect x="300" y="140" width="640" height="320" rx="16" fill="#FFFFFF" stroke="#475569" stroke-width="2" stroke-dasharray="8 4"/>
    <text x="620" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">EVAL LOOP - one iteration per golden-dataset row</text>

    <!-- Step 1: Call /answer -->
    <g filter="url(#shadow)">
      <rect x="320" y="200" width="180" height="100" rx="12" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2"/>
      <text x="410" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#1E1B4B">Call /answer</text>
      <text x="410" y="255" text-anchor="middle" font-size="10" fill="#475569">POST { question }</text>
      <text x="410" y="275" text-anchor="middle" font-size="10" fill="#475569">→ CitationRAG service</text>
      <text x="410" y="290" text-anchor="middle" font-size="9" font-style="italic" fill="#94A3B8">retrieve · generate · validate</text>
    </g>

    <!-- Step 2: Capture response -->
    <g filter="url(#shadow)">
      <rect x="540" y="200" width="180" height="100" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
      <text x="630" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Capture response</text>
      <text x="630" y="255" text-anchor="middle" font-size="10" fill="#475569">answer · citations</text>
      <text x="630" y="270" text-anchor="middle" font-size="10" fill="#475569">retrieval scores</text>
      <text x="630" y="290" text-anchor="middle" font-size="10" fill="#475569">refusal flag</text>
    </g>

    <!-- Step 3: Judge -->
    <g filter="url(#shadow)">
      <rect x="760" y="200" width="160" height="100" rx="12" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2.5"/>
      <text x="840" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#083344">Judge</text>
      <text x="840" y="250" text-anchor="middle" font-size="9" fill="#475569">substring + token-overlap</text>
      <text x="840" y="262" text-anchor="middle" font-size="9" fill="#475569">proxies + refusal check</text>
      <text x="840" y="280" text-anchor="middle" font-size="8" fill="#06B6D4" font-style="italic">LLM-as-judge arrives in</text>
      <text x="840" y="292" text-anchor="middle" font-size="8" fill="#06B6D4" font-style="italic">BreakRAG™</text>
    </g>

    <!-- arrows inside loop -->
    <path d="M500 250 L540 250" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M720 250 L760 250" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Tally -->
    <g filter="url(#shadow)">
      <rect x="520" y="350" width="240" height="80" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
      <text x="640" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#451A03">Tally per row</text>
      <text x="640" y="402" text-anchor="middle" font-size="10" fill="#475569">grounded? cited? refused?</text>
      <text x="640" y="418" text-anchor="middle" font-size="10" fill="#475569">→ accumulate metrics</text>
    </g>
    <path d="M840 300 Q840 350 760 380" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Loop-back arrow -->
  <path d="M620 460 Q300 540 150 400" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="300" y="540" text-anchor="middle" font-size="10" fill="#94A3B8" font-style="italic">next row</text>

  <!-- Metrics summary card -->
  <g filter="url(#shadow)">
    <rect x="980" y="180" width="180" height="280" rx="14" fill="#1E1B4B"/>
    <text x="1070" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">METRICS SUMMARY</text>
    <line x1="995" y1="222" x2="1145" y2="222" stroke="#475569"/>

    <text x="995" y="248" font-size="11" font-weight="600" fill="#10B981">Groundedness</text>
    <text x="1145" y="248" text-anchor="end" font-size="13" font-weight="700" fill="#FFFFFF">0.80</text>

    <text x="995" y="280" font-size="11" font-weight="600" fill="#F59E0B">Citation precision</text>
    <text x="1145" y="280" text-anchor="end" font-size="13" font-weight="700" fill="#FFFFFF">1.00</text>

    <text x="995" y="312" font-size="11" font-weight="600" fill="#F59E0B">Citation recall</text>
    <text x="1145" y="312" text-anchor="end" font-size="13" font-weight="700" fill="#FFFFFF">0.80</text>

    <text x="995" y="344" font-size="11" font-weight="600" fill="#F43F5E">False-answer rate</text>
    <text x="1145" y="344" text-anchor="end" font-size="13" font-weight="700" fill="#FFFFFF">0.00</text>

    <text x="995" y="376" font-size="11" font-weight="600" fill="#94A3B8">False-refusal rate</text>
    <text x="1145" y="376" text-anchor="end" font-size="13" font-weight="700" fill="#FFFFFF">0.20</text>

    <line x1="995" y1="392" x2="1145" y2="392" stroke="#475569"/>
    <text x="1070" y="416" text-anchor="middle" font-size="10" fill="#94A3B8" font-style="italic">tracked run-over-run</text>
  </g>

  <!-- Helper for arrows from tally to metrics -->
  <path d="M760 390 L980 320" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Footer -->
  <text x="600" y="648" text-anchor="middle" font-size="10" fill="#94A3B8">Applied GenAI &amp; Agentic AI Engineering Course · Week 05</text>
</svg>
