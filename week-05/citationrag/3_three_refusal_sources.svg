<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#D97706"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4F46E5"/>
    </marker>
    <marker id="arrowRose2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#F43F5E"/>
    </marker>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="600" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A">One refusal string, three different sources</text>
  <text x="600" y="80" text-anchor="middle" font-size="15" fill="#64748B">The answer text is byte-identical every time. The refusal_source field tells you which stage said no - and who owns the fix.</text>

  <!-- Pipeline strip -->
  <rect x="120" y="108" width="200" height="52" rx="10" fill="#FFFFFF" stroke="#CBD5E1" filter="url(#shadow)"/>
  <text x="220" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">1 · Retrieve</text>
  <text x="220" y="149" text-anchor="middle" font-size="11.5" fill="#64748B">top-k chunks + scores</text>

  <rect x="380" y="108" width="200" height="52" rx="10" fill="#FFFBEB" stroke="#D97706" filter="url(#shadow)"/>
  <text x="480" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#78350F">2 · Threshold gate</text>
  <text x="480" y="149" text-anchor="middle" font-size="11.5" fill="#92400E">top1 and spread checks</text>

  <rect x="640" y="108" width="200" height="52" rx="10" fill="#EEF2FF" stroke="#4F46E5" filter="url(#shadow)"/>
  <text x="740" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#1E1B4B">3 · Generate</text>
  <text x="740" y="149" text-anchor="middle" font-size="11.5" fill="#4338CA">LLM + citation contract</text>

  <rect x="900" y="108" width="200" height="52" rx="10" fill="#FFF1F2" stroke="#F43F5E" filter="url(#shadow)"/>
  <text x="1000" y="130" text-anchor="middle" font-size="14" font-weight="600" fill="#9F1239">4 · Validate</text>
  <text x="1000" y="149" text-anchor="middle" font-size="11.5" fill="#BE123C">IDs + verbatim quotes</text>

  <line x1="320" y1="134" x2="372" y2="134" stroke="#475569" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <line x1="580" y1="134" x2="632" y2="134" stroke="#475569" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <line x1="840" y1="134" x2="892" y2="134" stroke="#475569" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <!-- Drop arrows from stages to cards -->
  <line x1="480" y1="160" x2="240" y2="212" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <line x1="740" y1="160" x2="600" y2="212" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#arrowIndigo)"/>
  <line x1="1000" y1="160" x2="960" y2="212" stroke="#F43F5E" stroke-width="2.5" marker-end="url(#arrowRose2)"/>

  <!-- Card 1: threshold_gate -->
  <rect x="60" y="220" width="340" height="330" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="60" y="220" width="340" height="58" rx="14" fill="#FFFBEB"/>
  <rect x="60" y="264" width="340" height="14" fill="#FFFBEB"/>
  <text x="84" y="245" font-size="12" font-weight="700" letter-spacing="1.5" fill="#92400E">REFUSAL SOURCE 1</text>
  <text x="84" y="268" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#78350F">threshold_gate</text>

  <text x="84" y="308" font-size="14" font-weight="600" fill="#0F172A">Refused BEFORE the model ran</text>
  <text x="84" y="334" font-size="12.5" fill="#334155">top1 &lt; 0.55, or spread &lt; 0.08 after</text>
  <text x="84" y="352" font-size="12.5" fill="#334155">near-duplicate collapse. The retrieved</text>
  <text x="84" y="370" font-size="12.5" fill="#334155">context was too weak to trust, so no</text>
  <text x="84" y="388" font-size="12.5" fill="#334155">tokens were spent. Cheapest refusal.</text>

  <text x="84" y="420" font-size="12" font-weight="600" fill="#92400E">What it usually means</text>
  <text x="84" y="440" font-size="12.5" fill="#475569">The index does not cover the question,</text>
  <text x="84" y="458" font-size="12.5" fill="#475569">or the gate is tuned too tight.</text>

  <rect x="84" y="482" width="292" height="42" rx="8" fill="#78350F"/>
  <text x="230" y="500" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#FDE68A">FIX OWNER</text>
  <text x="230" y="517" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">RETRIEVAL</text>

  <!-- Card 2: llm -->
  <rect x="430" y="220" width="340" height="330" rx="14" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="430" y="220" width="340" height="58" rx="14" fill="#EEF2FF"/>
  <rect x="430" y="264" width="340" height="14" fill="#EEF2FF"/>
  <text x="454" y="245" font-size="12" font-weight="700" letter-spacing="1.5" fill="#4338CA">REFUSAL SOURCE 2</text>
  <text x="454" y="268" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#1E1B4B">llm</text>

  <text x="454" y="308" font-size="14" font-weight="600" fill="#0F172A">Model saw the chunks and said no</text>
  <text x="454" y="334" font-size="12.5" fill="#334155">Retrieval passed the gate, but the model</text>
  <text x="454" y="352" font-size="12.5" fill="#334155">judged the provided context does not</text>
  <text x="454" y="370" font-size="12.5" fill="#334155">answer the question, and returned the</text>
  <text x="454" y="388" font-size="12.5" fill="#334155">exact fallback string from the prompt.</text>

  <text x="454" y="420" font-size="12" font-weight="600" fill="#4338CA">What it usually means</text>
  <text x="454" y="440" font-size="12.5" fill="#475569">Chunks are on-topic but partial, or the</text>
  <text x="454" y="458" font-size="12.5" fill="#475569">prompt sets the bar for "enough" wrong.</text>

  <rect x="454" y="482" width="292" height="42" rx="8" fill="#1E1B4B"/>
  <text x="600" y="500" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#C7D2FE">FIX OWNER</text>
  <text x="600" y="517" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">CHUNKING or PROMPT</text>

  <!-- Card 3: validation -->
  <rect x="800" y="220" width="340" height="330" rx="14" fill="#FFFFFF" stroke="#F43F5E" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="800" y="220" width="340" height="58" rx="14" fill="#FFF1F2"/>
  <rect x="800" y="264" width="340" height="14" fill="#FFF1F2"/>
  <text x="824" y="245" font-size="12" font-weight="700" letter-spacing="1.5" fill="#BE123C">REFUSAL SOURCE 3</text>
  <text x="824" y="268" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#9F1239">validation</text>

  <text x="824" y="308" font-size="14" font-weight="600" fill="#0F172A">Model answered; validator rejected it</text>
  <text x="824" y="334" font-size="12.5" fill="#334155">The answer cited a chunk that was never</text>
  <text x="824" y="352" font-size="12.5" fill="#334155">sent, or a supporting quote that is not</text>
  <text x="824" y="370" font-size="12.5" fill="#334155">verbatim in the chunk. Shipping it would</text>
  <text x="824" y="388" font-size="12.5" fill="#334155">ship a lie with a false source attached.</text>

  <text x="824" y="420" font-size="12" font-weight="600" fill="#BE123C">What it usually means</text>
  <text x="824" y="440" font-size="12.5" fill="#475569">The model ignored the citation contract:</text>
  <text x="824" y="458" font-size="12.5" fill="#475569">fabricated IDs or paraphrased "quotes".</text>

  <rect x="824" y="482" width="292" height="42" rx="8" fill="#9F1239"/>
  <text x="970" y="500" text-anchor="middle" font-size="11" letter-spacing="1.5" fill="#FECDD3">FIX OWNER</text>
  <text x="970" y="517" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">INSTRUCTION-FOLLOWING</text>

  <!-- Bottom band: the shared string -->
  <rect x="60" y="586" width="1080" height="92" rx="14" fill="#0F172A" filter="url(#shadow)"/>
  <text x="600" y="622" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#E2E8F0">"I don't have that information in the provided sources."</text>
  <text x="600" y="652" text-anchor="middle" font-size="13" fill="#94A3B8">Byte-identical in all three cases - the UI, the eval and downstream code key on refusal_source, never on the text.</text>
</svg>
