<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#F43F5E"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#10B981"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>

  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#0F172A">CitationRAG Architecture</text>
  <text x="600" y="76" text-anchor="middle" font-size="14" fill="#64748B">FastAPI service. Retrieve → threshold gate → generate-with-citations → validate → return (or refuse).</text>

  <!-- User -->
  <g filter="url(#shadow)">
    <circle cx="80" cy="320" r="40" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <circle cx="80" cy="306" r="12" fill="#94A3B8"/>
    <path d="M55 345 Q80 320 105 345 L105 355 L55 355 Z" fill="#94A3B8"/>
  </g>
  <text x="80" y="380" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">User</text>

  <!-- FastAPI box -->
  <g filter="url(#shadow)">
    <rect x="170" y="260" width="160" height="120" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <text x="250" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">FastAPI</text>
    <text x="250" y="312" text-anchor="middle" font-size="11" fill="#475569">/answer</text>
    <text x="250" y="330" text-anchor="middle" font-size="11" fill="#475569">/eval</text>
    <text x="250" y="358" text-anchor="middle" font-size="9" fill="#94A3B8" font-style="italic">app/main.py</text>
  </g>

  <!-- Retrieve -->
  <g filter="url(#shadow)">
    <rect x="370" y="260" width="170" height="120" rx="14" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2.5"/>
    <circle cx="406" cy="295" r="18" fill="#06B6D4"/>
    <text x="406" y="302" text-anchor="middle" font-size="16" fill="#FFFFFF">🔍</text>
    <text x="440" y="298" font-size="14" font-weight="700" fill="#083344">Retrieve</text>
    <text x="385" y="328" font-size="10" fill="#475569">top-k chunks + scores</text>
    <text x="385" y="344" font-size="10" fill="#475569">+ top-1/top-3 spread</text>
    <text x="455" y="368" text-anchor="middle" font-size="9" fill="#94A3B8" font-style="italic">app/retriever.py</text>
  </g>

  <!-- KnowledgeVault index -->
  <g filter="url(#shadow)">
    <rect x="370" y="440" width="170" height="100" rx="14" fill="#ECFEFF" stroke="#06B6D4" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="455" y="468" text-anchor="middle" font-size="13" font-weight="700" fill="#083344">KnowledgeVault</text>
    <text x="455" y="486" text-anchor="middle" font-size="11" fill="#475569">index from Week 4</text>
    <text x="455" y="510" text-anchor="middle" font-size="10" fill="#94A3B8">the chunked 'Attention Is</text>
    <text x="455" y="525" text-anchor="middle" font-size="10" fill="#94A3B8">All You Need' paper</text>
  </g>

  <!-- Threshold gate (diamond) -->
  <g filter="url(#shadow)">
    <path d="M620 320 L700 260 L780 320 L700 380 Z" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="700" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#451A03">Threshold</text>
    <text x="700" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#451A03">gate</text>
    <text x="700" y="350" text-anchor="middle" font-size="9" fill="#475569">strong enough?</text>
  </g>

  <!-- Generate with citations -->
  <g filter="url(#shadow)">
    <rect x="820" y="260" width="180" height="120" rx="14" fill="#EEF2FF" stroke="#4F46E5" stroke-width="2.5"/>
    <circle cx="858" cy="295" r="18" fill="#4F46E5"/>
    <text x="858" y="302" text-anchor="middle" font-size="16" fill="#FFFFFF">🧠</text>
    <text x="892" y="290" font-size="13" font-weight="700" fill="#1E1B4B">Generate</text>
    <text x="892" y="305" font-size="13" font-weight="700" fill="#1E1B4B">w/ citations</text>
    <text x="836" y="330" font-size="10" fill="#475569">chunk-ID prompt contract</text>
    <text x="836" y="346" font-size="10" fill="#475569">structured JSON output</text>
    <text x="910" y="368" text-anchor="middle" font-size="9" fill="#94A3B8" font-style="italic">app/llm.py · pinned model</text>
  </g>

  <!-- Validate citations -->
  <g filter="url(#shadow)">
    <rect x="1030" y="260" width="140" height="120" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="1100" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#451A03">Validate</text>
    <text x="1100" y="306" text-anchor="middle" font-size="13" font-weight="700" fill="#451A03">citations</text>
    <text x="1100" y="328" text-anchor="middle" font-size="10" fill="#475569">ID exists?</text>
    <text x="1100" y="344" text-anchor="middle" font-size="10" fill="#475569">claim supported?</text>
    <text x="1100" y="368" text-anchor="middle" font-size="9" fill="#94A3B8" font-style="italic">app/citations.py</text>
  </g>

  <!-- Refusal branch -->
  <g filter="url(#shadow)">
    <rect x="620" y="450" width="180" height="100" rx="14" fill="#FEE2E2" stroke="#F43F5E" stroke-width="2.5"/>
    <text x="710" y="478" text-anchor="middle" font-size="14" font-weight="700" fill="#9F1239">Refusal</text>
    <text x="710" y="500" text-anchor="middle" font-size="10" fill="#475569">"I don't have that</text>
    <text x="710" y="514" text-anchor="middle" font-size="10" fill="#475569">information in the</text>
    <text x="710" y="528" text-anchor="middle" font-size="10" fill="#475569">provided sources."</text>
  </g>

  <!-- Response back -->
  <g filter="url(#shadow)">
    <rect x="1030" y="450" width="140" height="100" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
    <text x="1100" y="478" text-anchor="middle" font-size="14" font-weight="700" fill="#064E3B">Response</text>
    <text x="1100" y="500" text-anchor="middle" font-size="10" fill="#475569">answer + citations</text>
    <text x="1100" y="514" text-anchor="middle" font-size="10" fill="#475569">+ retrieval scores</text>
    <text x="1100" y="528" text-anchor="middle" font-size="10" fill="#475569">+ trace log</text>
  </g>

  <!-- Arrows -->
  <path d="M130 320 L170 320" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M330 320 L370 320" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M540 320 L620 320" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M455 440 L455 380" fill="none" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="475" y="420" font-size="10" fill="#06B6D4" font-style="italic">chunks + scores</text>

  <!-- YES path -->
  <path d="M780 320 L820 320" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrowEmerald)"/>
  <text x="800" y="310" text-anchor="middle" font-size="11" font-weight="700" fill="#10B981">YES</text>
  <path d="M1000 320 L1030 320" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1100 380 L1100 450" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrowEmerald)"/>

  <!-- NO path -->
  <path d="M700 380 L710 450" fill="none" stroke="#F43F5E" stroke-width="2.5" marker-end="url(#arrowRose)"/>
  <text x="690" y="425" text-anchor="middle" font-size="11" font-weight="700" fill="#F43F5E">NO</text>

  <!-- Validation-failure refusal path -->
  <path d="M1035 375 Q900 420 800 465" fill="none" stroke="#F43F5E" stroke-width="2.5" marker-end="url(#arrowRose)"/>
  <text x="935" y="412" text-anchor="middle" font-size="10" font-weight="700" fill="#F43F5E">fabricated/unsupported → refuse</text>
  <path d="M800 500 Q900 500 1030 490" fill="none" stroke="#F43F5E" stroke-width="2" marker-end="url(#arrowRose)" stroke-dasharray="5 3"/>

  <!-- Return to user -->
  <path d="M1030 480 Q600 600 130 360" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>
  <text x="600" y="600" text-anchor="middle" font-size="11" fill="#475569" font-style="italic">→ JSON response back to FastAPI client</text>

  <!-- Layer band footer -->
  <rect x="40" y="630" width="1120" height="50" rx="10" fill="#1E1B4B"/>
  <text x="600" y="652" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">Four-layer model - Model · Retrieval · Tool · Memory</text>
  <text x="600" y="670" text-anchor="middle" font-size="11" fill="#CBD5E1">Present: Model + Retrieval · Absent today: Tool · Memory</text>

  <!-- Footer -->
  <text x="600" y="708" text-anchor="middle" font-size="10" fill="#94A3B8">Applied GenAI &amp; Agentic AI Engineering Course · Week 05</text>
</svg>
